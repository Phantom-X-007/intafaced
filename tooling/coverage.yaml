    tracker: [dex.permissionless-access]
    note: >-
      WAS A GAP, closed by main on 2026-08-03 rather than by this PR. The audit's finding was never
      that the rule was unbuilt — packages/config/jurisdiction.ts and contracts/trpc.ts have carried
      it for weeks — but that it was absent from the board, so nothing could report on it. The `dex`
      module put it on the board: `dex.permissionless-access` names §503 and §585 in its own title,
      and checkAccess short-circuits the declared non-custodial plane to allowed.permissionless
      before any tier is read. Both this and §25:642 now cite it; one law rule written in two places
      is two capabilities and one row, which is the shape the mapping is for.
