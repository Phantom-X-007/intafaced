name: kyc-getfor-once
on:
  push:
    branches: [feat/svc-identity-kyc-get-refuse-blank-key]
    paths:
      - '.github/workflows/kyc-getfor-once.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/svc-identity-kyc-get-refuse-blank-key
      - name: requireKey before reader on getFor and remove this workflow
        run: |
          python3 services/svc-identity/scripts/patch-kyc-getfor.py
          rm -f .github/workflows/kyc-getfor-once.yml services/svc-identity/scripts/patch-kyc-getfor.py
          git config user.name ZenYoda3
          git config user.email intafaced@gmail.com
          git add services/svc-identity/src/kyc/document-store.ts .github/workflows/kyc-getfor-once.yml services/svc-identity/scripts/patch-kyc-getfor.py
          git commit -m "feat(svc-identity): getFor refuses blank IDENTITY_KYC_DOC_KEY before reader"
          git push
