server.port=7001
spring.application.name=service-rpc-act
#kafka
# 指定kafka 代理地址，可以多个
spring.kafka.bootstrap-servers=127.0.0.1:9092
# 指定默认消费者group id
spring.kafka.consumer.group-id=default-group
# 指定默认topic id
spring.kafka.template.default-topic= test
# 指定listener 容器中的线程数，用于提高并发量
spring.kafka.listener.concurrency= 3
# 每次批量发送消息的数量
spring.kafka.producer.batch-size= 1000
# mongodb
# Connection string, including its credentials, comes from the environment and
# has NO default. The literal that used to sit here carried a username and
# password against a placeholder host, so it was both a committed credential
# and unusable. An unresolved placeholder stops the service at startup.
spring.data.mongodb.uri=${WALLET_MONGODB_URI}

eureka.client.serviceUrl.defaultZone=http://127.0.0.1:7000/eureka/
# 注册时使用ip而不是主机名
eureka.instance.prefer-ip-address=true

coin.name=ACT
coin.unit=ACT
# Node RPC endpoint including its HTTP basic-auth credentials. Supplied by the
# environment, no default: the literal here was a node password.
coin.rpc=${ACT_NODE_RPC_URL}
coin.master-address=ACT5i65XW1yRasdeLMD2rFJffRmndn91bho6

# Shared secret required on every /rpc/** call (header X-Rpc-Auth-Token).
# No default: if WALLET_RPC_AUTH_TOKEN is unset the placeholder does not
# resolve and the service refuses to start, rather than exposing the
# withdrawal endpoints to anyone who can reach the port.
rpc.auth-token=${WALLET_RPC_AUTH_TOKEN}
