name: apply-add-collateral
on:
  push:
    branches:
      - feat/bank-loan-add-collateral-mark
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply mark refuse
        run: python3 scripts/apply-add-collateral.py
      - name: Commit and remove one-shot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/apply-add-collateral.yml scripts/apply-add-collateral.py
          git add services/svc-bank/src/loans/loan-service.ts services/svc-bank/src/loans/loans.test.ts
          git commit -m "feat(svc-bank): addCollateral refuses a missing mark before any lock"
          git push
