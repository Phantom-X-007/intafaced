    <style>
        html, body{
            background: #000000;
        }
        .init-loading{
            width: 98%;
            height: 20px;
            position:absolute;
            top: 40%;
            text-align: center;
            z-index: 9999;
        }
        .loading span {
            display: inline-block;
            vertical-align: middle;
            width: .6em;
            height: .6em;
            margin: .19em;
            background: #c8c8c8;
            border-radius: .6em;
            -webkit-animation: loading 1s infinite alternate;
            animation: loading 1s infinite alternate;
        }

        /* One accent, fading out along the row — the dots read as a single
           brand mark rather than seven unrelated colours. Dot 1 was left teal
           when the ramp below was already orange, so the splash visibly clashed
           on every page load; the accent remap closes that. */
        .loading span:nth-of-type(2) { background: #f26400; animation-delay: 0.2s; -webkit-animation-delay: 0.2s; }
        .loading span:nth-of-type(3) { background: #e45d00; animation-delay: 0.4s; -webkit-animation-delay: 0.4s; }
        .loading span:nth-of-type(4) { background: #d65600; animation-delay: 0.6s; -webkit-animation-delay: 0.6s; }
        .loading span:nth-of-type(5) { background: #b84a00; animation-delay: 0.8s; -webkit-animation-delay: 0.8s; }
        .loading span:nth-of-type(6) { background: #8f3a00; animation-delay: 1.0s; -webkit-animation-delay: 1.0s; }
        .loading span:nth-of-type(7) { background: #663000; animation-delay: 1.2s; -webkit-animation-delay: 1.2s; }

        /*
        * Animation keyframes
        * Use transition opacity instead of keyframes?
        */
        @-webkit-keyframes loading {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }
        @keyframes loading {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }
        .loading-text {
            color: #c8c8c8;
            margin: 0;
            font: .8em verdana;
            text-transform: uppercase;
            letter-spacing: .1em;
        }
        .loading-text2{
            color: #8a8a8a;
            margin-top: 130px;
            font: .7em verdana;
            letter-spacing: .1em;
            display: none;
        }
        .loading-text2 a{
            color: #8a8a8a;
        }
    </style>
</head>

        </div>
    </div>

</body>
