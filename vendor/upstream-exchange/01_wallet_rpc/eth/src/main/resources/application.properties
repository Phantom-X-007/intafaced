server.port=7003
spring.application.name=service-rpc-eth
#kafka
# \u6307\u5B9Akafka \u4EE3\u7406\u5730\u5740\uFF0C\u53EF\u4EE5\u591A\u4E2A
spring.kafka.bootstrap-servers=111.111.111.111:9092
# \u00E6\u008C\u0087\u00E5\u00AE\u009A\u00E9\u00BB\u0098\u00E8\u00AE\u00A4\u00E6\u00B6\u0088\u00E8\u00B4\u00B9\u00E8\u0080\u0085group id
spring.kafka.consumer.group-id=default-group
# \u00E6\u008C\u0087\u00E5\u00AE\u009A\u00E9\u00BB\u0098\u00E8\u00AE\u00A4topic id
spring.kafka.template.default-topic=test
# \u00E6\u008C\u0087\u00E5\u00AE\u009Alistener \u00E5\u00AE\u00B9\u00E5\u0099\u00A8\u00E4\u00B8\u00AD\u00E7\u009A\u0084\u00E7\u00BA\u00BF\u00E7\u00A8\u008B\u00E6\u0095\u00B0\u00EF\u00BC\u008C\u00E7\u0094\u00A8\u00E4\u00BA\u008E\u00E6\u008F\u0090\u00E9\u00AB\u0098\u00E5\u00B9\u00B6\u00E5\u008F\u0091\u00E9\u0087\u008F
spring.kafka.listener.concurrency=1
# \u6BCF\u6B21\u6279\u91CF\u53D1\u9001\u6D88\u606F\u7684\u6570\u91CF\u0087\u008F
spring.kafka.producer.batch-size=1000
# mongodb
# Connection string, including its credentials, comes from the environment and
# has NO default. The literal that used to sit here carried a username and
# password against a placeholder host, so it was both a committed credential
# and unusable. An unresolved placeholder stops the service at startup.
spring.data.mongodb.uri=${WALLET_MONGODB_URI}
eureka.client.serviceUrl.defaultZone=http://111.111.111.111:7000/eureka/
# \u6CE8\u518C\u65F6\u4F7F\u7528ip\u800C\u4E0D\u662F\u4E3B\u673A\u540D\u0090\u008D
eureka.instance.prefer-ip-address=true
#\u5E01\u79CD\u4FE1\u606F\u914D\u7F6E
coin.rpc=http://127.0.0.1:8545
coin.name=Ethereum
coin.unit=ETH
coin.keystore-path=/data/eth/data/keystore
# Keystore passwords are supplied by the environment and have NO default.
# An unresolved placeholder makes the service fail to start, which is the
# intended behaviour: an unset password must never silently become "".
coin.keystore-password=${ETH_KEYSTORE_PASSWORD}
# \u521D\u59CB\u5316\u5E01\u79CD\u4FE1\u606F
coin.init-block-height=8336120
coin.step=10
coin.withdraw-wallet=UTC--2019-08-13T06-24-07.378035684Z--672881426632b13d8f474664c039acc7b5610b7
coin.withdraw-wallet-password=${ETH_WITHDRAW_WALLET_PASSWORD}
coin.gas-limit=40000
coin.min-collect-amount=0.1
# The platform's OWN withdrawal wallet. EthWatcher credits a deposit UNLESS the
# transaction's `from` equals this value, so its job is: do not read money the
# platform sent OUT as money a customer sent IN.
#
# It shipped with 39 hex digits where an EVM address has 40. A `from` returned by
# a node always has 40, so the comparison at EthWatcher.java:50 and :95 could
# never be true, the exclusion never excluded, and a customer who withdrew to
# their own deposit address on this platform was credited the withdrawal straight
# back — they keep the money AND the balance. No attacker required. Every other
# constant the upstream mangled fails CLOSED; this one failed OPEN.
#
# The 40th digit is RESTORED here, and the value is not guessed. Three properties
# in this tree name this one account, each with a different digit deleted —
# eth:35 (index 16), this line (index 19) and erc-token:32 (index 10) — and the
# set of 40-digit strings consistent with all three has exactly one member. Each
# PAIR also intersects to one, so the reconstruction is corroborated three times
# over. Working: docs/security/WALLET-RPC-SECURITY-REVIEW-2026-08-05.md §7.5,
# re-derived from these files rather than copied out of that document.
#
# Caveat, recorded because it is the one thing here that is not certain: this
# account has nonce 0, no code and no balance on Ethereum mainnet, so the string
# the upstream mangled has no on-chain history. That does not affect the change.
# Restoring the width can only make an exclusion that matched NEVER match
# SOMETIMES, so it can only produce FEWER credits, never more. And the invariant
# that actually matters is internal: this line must name the same account as
# coin.withdraw-wallet above, which is the account every ETH withdrawal is signed
# from. Both were mangled from the same string; this one is now un-mangled.
#
# coin.withdraw-wallet (line 35) is STILL 39 digits, deliberately: it fails
# closed — the keystore filename does not exist, so no withdrawal happens — and
# correcting it is a separate change needing a keystore fixture. When it is
# corrected it must be corrected to THIS account.
coin.ignore-from-address=0x672881426632b13d18f474664c039acc7b5610b7
watcher.init-block-height=8347300
watcher.step=10
watcher.confirmation=20
watcher.interval=5000

# Shared secret required on every /rpc/** call (header X-Rpc-Auth-Token).
# No default: if WALLET_RPC_AUTH_TOKEN is unset the placeholder does not
# resolve and the service refuses to start, rather than exposing the
# withdrawal endpoints to anyone who can reach the port.
rpc.auth-token=${WALLET_RPC_AUTH_TOKEN}

# EIP-155 chain id for the withdrawal signing path. Environment only, NO
# DEFAULT: an unset value must stop the service rather than let it sign a
# transaction that is valid on every EVM chain at once. web3j 3.3.1 takes the
# chain id as a byte and truncates v, so the largest id it signs correctly is
# 109 - PaymentHandler refuses anything above that at startup rather than
# emitting a signature that is right only half the time. Mainnet 1, BSC 56 and
# Kovan 42 are reachable; Polygon 137, Holesky 17000, Arbitrum 42161 and
# Sepolia 11155111 are NOT, and need a web3j upgrade first.
coin.chain-id=${ETH_CHAIN_ID}
