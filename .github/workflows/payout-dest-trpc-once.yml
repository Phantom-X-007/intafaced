name: payout-dest-trpc-once
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/payout-dest-trpc-once.yml
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pay-merchant-payout-destination
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Map dest errors in toTrpcError
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('services/svc-pay/src/router.ts')
          t = p.read_text()
          old = '  if (!(err instanceof PayError)) return err;'
          new = (
              "  if (err instanceof DestinationKindError) {\n"
              "    return new TRPCError({ code: 'BAD_REQUEST', message: `${err.code}: ${err.message}`, cause: err });\n"
              "  }\n"
              "  if (err instanceof PayoutDestinationMissingError) {\n"
              "    return new TRPCError({ code: 'PRECONDITION_FAILED', message: `${err.code}: ${err.message}`, cause: err });\n"
              "  }\n"
              "  if (!(err instanceof PayError)) return err;"
          )
          tail = t.split('function toTrpcError')[-1]
          if 'err instanceof DestinationKindError' in tail:
              print('already patched')
          else:
              if old not in t:
                  raise SystemExit('guard missing')
              p.write_text(t.replace(old, new, 1))
              print('patched')
          PY
      - name: Commit and self-delete
        run: |
          git config user.name "Sovereign Builder"
          git config user.email "intafaced@gmail.com"
          git rm -f .github/workflows/payout-dest-trpc-once.yml
          git add services/svc-pay/src/router.ts
          git diff --cached --quiet && git commit --allow-empty -m "ci: remove payout dest trpc one-shot" || git commit -m "fix(svc-pay): map payout dest errors in toTrpcError"
          git push origin HEAD:feat/pay-merchant-payout-destination
