name: pay-checkout-unavailable-once
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/pay-checkout-unavailable-once.yml
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Map live acquiring refuses onto unavailable
        run: |
          python3 << 'PY'
          from pathlib import Path

          p = Path('services/svc-pay/src/checkout-page.ts')
          t = p.read_text()
          old = """    // The posture refusal, a rail that cannot move value, a suspended merchant,
    // and live acquiring without approved KYB (D26-P1-P10 Layer B, already on
    // the money door) all land on the same page: each means "this merchant
    // cannot take payment right now". Telling a payer which one it is discloses
    // our rail estate or KYB state to the internet. A 500 here was a lie —
    // nothing broke; the merchant cannot take live payment.
    case 'pay.checkout_rail_not_live':
    case 'pay.rail_not_live':
    case 'pay.merchant_inactive':
    case 'pay.routing_no_rail':
    case 'pay.kyb_required':
      return { kind: 'unavailable' };"""
          new = """    // Live acquiring refuses that still reached this switch as a 500. Each
    // means "this merchant cannot take payment right now". Same page as #1808:
    // nothing charged, no try-again, no estate leak. Operator stubs
    // (`pay.kyb_operator_required`) and per-payment rail declines stay unmapped
    // — those are not "merchant cannot take live payment", and the unavailable
    // copy says no payment was started.
    case 'pay.checkout_rail_not_live':
    case 'pay.rail_not_live':
    case 'pay.sandbox_rail_refused':
    case 'pay.merchant_inactive':
    case 'pay.merchant_not_found':
    case 'pay.merchant_pricing_invalid':
    case 'pay.routing_no_rail':
    case 'pay.rail_unknown':
    case 'pay.rail_capability':
    case 'pay.kyb_required':
      return { kind: 'unavailable' };"""
          if old not in t:
              raise SystemExit('checkout-page.ts block not found')
          p.write_text(t.replace(old, new, 1))

          p = Path('services/svc-pay/src/checkout-page.test.ts')
          t = p.read_text()
          old = """    // Layer B money-door refuse — hosted HTML must not 500 a live KYB gap.
    expect(stateForError(payErr('pay.kyb_required', '')).kind).toBe('unavailable');
    // Operator stub decide is not a checkout money door — do not over-map.
    expect(stateForError(payErr('pay.kyb_operator_required', '')).kind).toBe('error');
    // Anything unrecognised is a 500, never a friendlier-looking state — the
    // friendly-looking states are the ones that imply money moved.
    expect(stateForError(payErr('pay.something_new', '')).kind).toBe('error');
    expect(stateForError(new Error('boom')).kind).toBe('error');"""
          new = """    // Layer B money-door refuse — hosted HTML must not 500 a live KYB gap.
    expect(stateForError(payErr('pay.kyb_required', '')).kind).toBe('unavailable');
    // Remaining live-acquiring refuses that still 500'd after #1808.
    expect(stateForError(payErr('pay.merchant_pricing_invalid', '')).kind).toBe('unavailable');
    expect(stateForError(payErr('pay.merchant_not_found', '')).kind).toBe('unavailable');
    expect(stateForError(payErr('pay.rail_unknown', '')).kind).toBe('unavailable');
    expect(stateForError(payErr('pay.rail_capability', '')).kind).toBe('unavailable');
    expect(stateForError(payErr('pay.sandbox_rail_refused', '')).kind).toBe('unavailable');
    expect(stateForError(payErr('pay.rail_not_live', '')).kind).toBe('unavailable');
    // Operator stub decide is not a checkout money door — do not over-map.
    expect(stateForError(payErr('pay.kyb_operator_required', '')).kind).toBe('error');
    expect(stateForError(payErr('pay.kyb_invalid', '')).kind).toBe('error');
    expect(stateForError(payErr('pay.psp_mode_required', '')).kind).toBe('error');
    // Per-payment rail decline is not "merchant cannot take payment" — a
    // payment was started; unavailable copy would lie.
    expect(stateForError(payErr('pay.rail_declined', '')).kind).toBe('error');
    // Anything unrecognised is a 500, never a friendlier-looking state — the
    // friendly-looking states are the ones that imply money moved.
    expect(stateForError(payErr('pay.something_new', '')).kind).toBe('error');
    expect(stateForError(new Error('boom')).kind).toBe('error');"""
          if old not in t:
              raise SystemExit('test stateForError block not found')
          t = t.replace(old, new, 1)

          old = """    expect(res.body.toLowerCase()).not.toContain('something went wrong');
    await app.close();
  });

  it('polls a session by its own token', async () => {"""
          new = """    expect(res.body.toLowerCase()).not.toContain('something went wrong');
    await app.close();
  });

  it('shows the unavailable page when live pricing is unpublished — not a 500, not a receipt', async () => {
    const app = await build({
      openCheckoutSession: async () => {
        throw payErr('pay.merchant_pricing_invalid', 'Merchant x has no fee rate and no default is configured');
      },
    });

    const res = await app.inject({
      method: 'POST',
      url: '/checkout/session',
      headers: { 'content-type': 'application/x-www-form-urlencoded' },
      payload: 'token=pl_stubbed_token_value&geoCountry=DE',
    });

    expect(res.statusCode).toBe(503);
    expect(res.body).toContain('Nothing has been charged');
    expect(res.body.toLowerCase()).not.toContain('try again');
    expect(res.body.toLowerCase()).not.toContain('pricing');
    expect(res.body.toLowerCase()).not.toContain('fee');
    expect(res.body.toLowerCase()).not.toContain('something went wrong');
    await app.close();
  });

  it('polls a session by its own token', async () => {"""
          if old not in t:
              raise SystemExit('kyb route test block not found')
          p.write_text(t.replace(old, new, 1))
          print('patched')
          PY
      - name: Commit patch and self-delete
        run: |
          git config user.name "Sovereign Builder"
          git config user.email "intafaced@gmail.com"
          git rm .github/workflows/pay-checkout-unavailable-once.yml
          git add services/svc-pay/src/checkout-page.ts services/svc-pay/src/checkout-page.test.ts
          git commit -m "$(cat <<'MSG'
          feat(svc-pay): map remaining live-acquiring checkout refuses to unavailable

          Hosted checkout 500'd unpublished pricing, missing merchant, and
          unknown/incapable rails. Same unavailable page as #1808: nothing
          charged, no try-again, no estate leak. Operator stubs and
          per-payment rail declines stay unmapped.
          MSG
          )"
          git push
