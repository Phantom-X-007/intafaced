name: prettier-withdraw-once
on:
  push:
    branches: [feat/bank-user-withdraw-destination]
  workflow_dispatch:
jobs:
  fmt:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: prettier write touched files and self-delete
        run: |
          pnpm exec prettier --write \
            services/svc-bank/src/withdraw-destination.ts \
            services/svc-bank/src/withdraw-destination.test.ts \
            services/svc-bank/src/ramps/ramp-service.ts \
            services/svc-bank/src/ramps/ramps.test.ts \
            services/svc-bank/src/ramps/ramps-fiat-product.test.ts \
            services/svc-bank/src/ramps/ramps.reachable.test.ts \
            services/svc-bank/src/router.ts \
            services/svc-bank/src/db/schema.ts \
            services/svc-bank/src/errors.ts \
            services/svc-bank/src/bank-service.test.ts \
            services/svc-bank/src/promise-falsify-public-doors.test.ts
          rm -f .github/workflows/prettier-withdraw-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "style(svc-bank): prettier withdraw dest"
          git push
