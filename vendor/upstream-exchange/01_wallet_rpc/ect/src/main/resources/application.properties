server.port=7005
spring.application.name=service-rpc-etc
eureka.client.serviceUrl.defaultZone=http://127.0.0.1:7000/eureka/
# 注册时使用ip而不是主机名
eureka.instance.prefer-ip-address=true

spring.data.mongodb.uri=mongodb://127.0.0.1:27017/wallet

coin.rpc=http://127.0.0.1:5990/v1
coin.name=ECT
coin.unit=ECT
coin.master-address=esV75BQfiEiKdgaivjasdw7EXk3BwJiscX
coin.init-block-height=39610

# THE WITHDRAWAL SIGNING SECRET. Environment only, no default.
#
# This is the `secret` field POSTed to coin.rpc by EctApi.sendFrom — whoever
# holds it can move every coin at coin.withdraw-address. It shipped here as a
# committed literal, so that literal is disclosed forever by git history and
# must be treated as compromised. Rotating it is an owner action, not a code
# change: see docs/OWNER-ACTIONS-WALLET-RPC-SECRETS.md.
#
# The placeholder alone is not what makes this fatal. `coin.*` is bound by
# @ConfigurationProperties, and this very file shipped with rpc.auth-token as a
# placeholder that nothing read and that therefore never stopped anything.
# EctWithdrawSecretConfig asserts the value explicitly at startup for that
# reason — do not delete it and rely on placeholder resolution instead.
coin.withdraw-wallet=${ECT_WITHDRAW_WALLET_SECRET}

# Public address, not a credential. Deliberately left as a literal.
coin.withdraw-address=esV75BQfiEiKdasdejEYCt7EXk3BwJiscX

# Shared secret required on every /rpc/** call (header X-Rpc-Auth-Token).
# No default: if WALLET_RPC_AUTH_TOKEN is unset the placeholder does not
# resolve and the service refuses to start, rather than exposing the
# withdrawal endpoints to anyone who can reach the port.
rpc.auth-token=${WALLET_RPC_AUTH_TOKEN}
