# INTAFACED · OpenTelemetry collector (§9 Observability)
# "every ledger recipe, order, payment traced end-to-end" — from day one, not later.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 2s
    send_batch_size: 512
  resource:
    attributes:
      - key: deployment.environment
        value: dev
        action: upsert
  # Money paths must never be sampled away.
  tail_sampling:
    decision_wait: 5s
    policies:
      - name: always-keep-money-paths
        type: string_attribute
        string_attribute:
          key: intafaced.money_path
          values: ['true']
      - name: keep-errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: sample-the-rest
        type: probabilistic
        probabilistic:
          sampling_percentage: 100 # dev: keep everything

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write
    tls:
      insecure: true
  debug:
    verbosity: basic

service:
  telemetry:
    logs:
      level: warn
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource, tail_sampling, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [prometheusremotewrite]
    logs:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [debug]
