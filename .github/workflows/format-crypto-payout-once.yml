name: format-crypto-payout-once
on:
  push:
    paths:
      - .github/workflows/format-crypto-payout-once.yml
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pay-crypto-payout-stored-evm
      - name: Apply prettier wrap
        run: git apply services/svc-pay/scripts/fmt-crypto.patch
      - name: Commit and self-delete
        run: |
          git config user.name "Sovereign Builder"
          git config user.email "intafaced@gmail.com"
          git rm -f .github/workflows/format-crypto-payout-once.yml
          git rm -f services/svc-pay/scripts/fmt-crypto.patch
          git add services/svc-pay/src/payment-service.ts services/svc-pay/src/payment-service.test.ts
          git commit -m "style(svc-pay): prettier wrap on crypto payout refuse"
          git push origin HEAD:feat/pay-crypto-payout-stored-evm
