name: payout-dest-wire-once
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/payout-dest-wire-once.yml
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pay-merchant-payout-destination
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Wire persist into router, index, schema
        run: python3 services/svc-pay/scripts/wire-payout-dest.py
      - name: Commit patch and self-delete
        run: |
          git config user.name "Sovereign Builder"
          git config user.email "intafaced@gmail.com"
          git rm -f .github/workflows/payout-dest-wire-once.yml
          git rm -f services/svc-pay/scripts/wire-payout-dest.py
          git add services/svc-pay/src/index.ts services/svc-pay/src/router.ts services/svc-pay/src/db/schema.ts
          git commit -m "$(cat <<'MSG'
feat(svc-pay): wire persisted payout dest into merchant payout

setPayoutDestination + payout load the stored IBAN/IFSC/EVM ref
before payoutSettlement/withdrawHold. bank-payout stays absent.
MSG
)"
          git push origin HEAD:feat/pay-merchant-payout-destination
