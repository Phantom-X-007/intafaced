name: Outreach Tinypool compatibility

on:
  push:
    branches:
      - feat/outreach-runtime-wiring
    paths:
      - .github/workflows/outreach-tinypool-compat.yml
      - tooling/ci/outreach-tinypool-compat.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vitest-tinypool-node20:
    name: Vitest ${{ matrix.vitest }} / Tinypool 2.1.2 on Node 20
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        vitest: ['3.2.4', '3.2.7']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: Verify pool isolation, retry, and failure reporting
        run: node tooling/ci/outreach-tinypool-compat.mjs "${{ matrix.vitest }}"
