name: prettier-release-excess
on:
  push:
    branches:
      - feat/bank-loan-release-excess
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wrap overlong line
        run: python3 scripts/prettier-release-excess.py
      - name: Commit and remove one-shot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/prettier-release-excess.yml scripts/prettier-release-excess.py
          git add services/svc-bank/src/loans/loan-service.ts
          git diff --cached --quiet && echo 'no change' && exit 1
          git commit -m "style(svc-bank): wrap releaseExcess LTV refuse for prettier"
          git push
