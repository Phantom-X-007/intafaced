global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: intafaced
    env: dev

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: nats
    metrics_path: /metrics
    static_configs:
      - targets: ['nats:8222']
