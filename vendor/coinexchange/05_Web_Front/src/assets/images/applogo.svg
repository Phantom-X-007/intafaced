<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="INTAFACED">
  <title>INTAFACED</title>
  <defs>
    <linearGradient id="ixApp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8534"/>
      <stop offset="1" stop-color="#ff6b00"/>
    </linearGradient>
    <radialGradient id="ixGlow" cx="0.5" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- App icon: black tile, orange mark. Square-cornered artwork would be
       clipped by the OS mask, so the radius is baked in. -->
  <rect width="240" height="240" rx="54" fill="#0a0a0a"/>
  <rect width="240" height="240" rx="54" fill="url(#ixGlow)"/>
  <g transform="translate(62,54)">
    <rect x="46" y="0" width="24" height="132" rx="12" fill="url(#ixApp)"/>
    <rect x="0" y="0" width="24" height="54" rx="12" fill="url(#ixApp)" opacity="0.6"/>
    <rect x="92" y="78" width="24" height="54" rx="12" fill="url(#ixApp)" opacity="0.6"/>
  </g>
</svg>
