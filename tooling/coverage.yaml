# ── ROWS ON THE BOARD THAT DO NOT IMPLEMENT A LAW LINE ───────────────────────
# The other direction. A row here is not wrong — the law is a document and the
# repo is alive — but it must answer to SOMETHING written down. `basis: orphan`
# means it answers to nothing, and orphans are ratcheted.
#
#   adr | spec | decision  → `source:` must be a document that exists on disk
#   law-extension          → `extends:` must be a section number that exists
#   orphan                 → nobody decided it. Counted in baseline.orphans.
tracker_extra:
  - id: trade.ccxt-api
    basis: orphan
    reason: >-
      No law basis, no ADR, no spec — `grep -l CCXT docs/adr/ docs/SPEC-*.md` returns nothing. It is
      acknowledged in passing at docs/DIRECTION-2026-07-31.md:21 as an existing fact, never decided as
      product. It is now the de-facto public trade API, with no owner and no spec, and §27:755 forbids
      a third-party connectivity library in the money path — which is what its name promises.
  - id: identity.kyc-review
    basis: decision
    source: docs/decisions/kyc-posture.md
    reason: >-
      Routed KYC with an operator approve/reject queue is an operational shape §4.1 does not describe.
      The posture decision is written down and the row implements it.
  - id: identity.step-up
    basis: decision
    source: docs/decisions/kyc-posture.md
    reason: >-
      Step-up challenge minting a short-lived trade:withdraw scope. §9:433 requires withdrawal
      allow-lists and delay tiers but not this mechanism; the row's own note explains the bug it closed.
  - id: infra.worktrees
    basis: decision
    source: CONTRIBUTING.md
    reason: >-
      Worktree tooling and the GitHub Flow it enforces. Pure developer process, not product law — and
      it is the mechanism that keeps two agents out of one working directory.
  - id: socket.contract-toolchain
    basis: law-extension
    extends: 13
    reason: >-
      Foundry plus a contract test suite in CI. §13 lists five deliberate non-v1 items and this is not
      one of them, so §14.8's "zero TODOs without a §13 socket entry" is checked against a list that
      does not contain it. Legitimate evolution, unamended law — audit §B5 row 3.
  - id: socket.contract-audit
    basis: law-extension
    extends: 13
    reason: >-
      External audit of the account and factory suite, blocking every mainnet deploy. Same §13
      arithmetic as socket.contract-toolchain — the law lists five sockets, the board carries nineteen.
  - id: socket.userop-differential-test
    basis: law-extension
    extends: 13
    reason: >-
      getUserOperationHash checked against a live EntryPoint. A §17.4 correctness obligation held open
      as a socket, which §13 as written has no room for.
  - id: socket.p256-verifier
    basis: law-extension
    extends: 13
    reason: >-
      Passkey P-256 owner verifier contract. §17.4:525 promises passkey-native accounts; the verifier
      that makes it true is held as a socket the law does not list.
  - id: socket.paymaster-policy
    basis: law-extension
    extends: 13
    reason: >-
      Who pays gas. §17.4:525 promises passkey-native accounts and says nothing about gas, so an
      account that is provably the user's and cannot move is inside the law as written. The paymaster
      fields already exist in the user operation this repo builds; the policy and the funded account
      behind it do not, and §13 has no room for that gap.
  - id: socket.bundler-policy
    basis: law-extension
    extends: 13
    reason: >-
      Bundler dependency, public relay or self-hosted. The law assumes a user operation reaches the
      chain and never names who relays it. A public bundler can censor or reorder that operation,
      which is a sovereignty question §16-§17 implies and does not decide.
  - id: socket.price-oracle
    basis: law-extension
    extends: 13
    reason: >-
      Price oracle for on-chain marks and liquidations. §17.5 lending markets require marks and the
      law names no source; a guessed mark liquidates real collateral, so this is held open rather
      than invented. Blocks protocol.lending and couples to protocol.amm.
  - id: socket.deployment-registry
    basis: law-extension
    extends: 13
    reason: >-
      Which contracts are deployed where, verified against which source. §17.2 P0 assumes contracts
      on proven rails; nothing in the law asks for the record of what was deployed, and without it a
      deployed address cannot be reconstructed or audited later.
  - id: socket.ledger-sharding
    basis: law-extension
    extends: 13
    reason: >-
      Per-asset hash chains with a cross-shard anchor. A scaling path for §4.2's single hash chain,
      deliberately deferred, and §13 does not list it.
  - id: socket.evm-rpc
    basis: law-extension
    extends: 13
    reason: >-
      A real EVM ChainSource with RPC and log decoding. §17.2 P0 assumes proven rails exist; the row
      holds the seam open. Marked done — the socket is filled, and the entry stays until §13 is amended.
  - id: socket.clob-contracts
    basis: law-extension
    extends: 13
    reason: >-
      An audited venue contract emitting the indexed event surface. §17.1 describes INTACORE; nothing
      in §13 reserves the contract that would emit it.
  - id: socket.dex-venue-set
    basis: law-extension
    extends: 13
    reason: >-
      A venue this platform actually quotes. Arrived on main 2026-08-03 with the dex module. §13
      reserves sockets for rails that must be filled from outside; it does not carry this one, and
      the blocker is explicitly a decision rather than code — svc-dex can read three kinds of venue
      and no ADR or spec names which one the platform quotes.
  - id: socket.dex-fee-source
    basis: law-extension
    extends: 13
    reason: >-
      An authoritative per-venue fee and settlement schedule. Fees are configured rather than sourced,
      and the settlement cost is a declared understatement, so the seam is held open rather than
      pretended shut. §2 forbids reading svc-trade's markets table, which is where the real schedule
      lives — the deferral is law-shaped and §13 does not list it.
  - id: socket.dex-execution
    basis: law-extension
    extends: 13
    reason: >-
      Execution against a quoted venue. §27 names the vault and §28 the OMS, so the destination is
      law; the socket is the seam between a router that can only price and a service that can fill.
  - id: socket.indexer-stream
    basis: law-extension
    extends: 13
    reason: >-
      A live book and tape feed from the projection. §5.3 promises ws-gateway streams; the protocol-side
      transport for them is deferred as a socket §13 does not carry.
  - id: socket.stream-provider
    basis: law-extension
    extends: 13
    reason: >-
      A real WebRTC SFU behind StreamProvider. §8.3 names self-hosted LiveKit as v1, so the interface is
      law but the deferral is not — §13 does not list it.
  - id: socket.notify-push
    basis: law-extension
    extends: 13
    reason: >-
      Push channel, blocked on gateway credentials. §9:431 makes notification adapters law; §13 does not
      reserve the credential-blocked ones, so these three sockets extend it.
  - id: socket.notify-email
    basis: law-extension
    extends: 13
    reason: >-
      Email channel, blocked on gateway credentials. Same §13 arithmetic as socket.notify-push.
  - id: socket.notify-sms
    basis: law-extension
    extends: 13
    reason: >-
      SMS channel, blocked on gateway credentials. Same §13 arithmetic as socket.notify-push.
  - id: socket.geo-region-resolution
    basis: law-extension
    extends: 13
    reason: >-
      Per-request region resolution from a trusted upstream geo header. svc-edge reads DEFAULT_REGION
      once and stamps that one value onto the principal of every request, so §24 Lane A's sanctions
      screening — which is law, and is correctly implemented in packages/config — evaluates ONE
      CONSTANT REGION for all traffic. §13 reserves five deliberate non-v1 items and does not carry
      this one, and the deferral is real: region must never be caller-supplied, so closing it is a
      deployment-topology decision about which CDN header is trusted and what happens when it is
      absent, not a header read. Recorded as a socket rather than left silent because the undeclared
      version of this gap reads as a claim that traffic is screened.
  - id: socket.social-recovery
    basis: law-extension
    extends: 13
    reason: >-
      CONTRADICTS THE LAW, not merely extending it. The row says a guardian is a second party who can
      take the account and the platform must never be one. §17.4:525 lists social recovery as a property
      of the smart account, §34:829 specs guardian M-of-N as a premium product, and §38:854 adds a
      guardian-recovery DoD test. A tracker row overrode two law sections with no ADR — audit §B5 row 2.
      Recorded here so the contradiction is visible rather than buried in a note; the owner's pen resolves it.

# ── §11 DROP PHASES ──────────────────────────────────────────────────────────
# §25:740 — "any Vol. I feature without a green DoD at its phase gate blocks the
# drop phase that promised it." A phase blocks only once `promised: true`. That
# is the difference between a gate that enforces a promise and a gate that fails
# every run before anyone has promised anything.
