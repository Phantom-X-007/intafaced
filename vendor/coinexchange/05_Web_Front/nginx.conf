# Serving config for the vendored trading shell.
#
# Two jobs: serve an SPA, and proxy the API to svc-edge so the browser stays
# same-origin. Same-origin matters more than it looks — it is why there is no
# CORS preflight and why the session cookie is actually carried.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The built bundle is emitted to `dist/assets/`, but webpack's
    # `assetsPublicPath` is `/static/`, so every generated URL is
    # `/static/assets/...`. Serving `dist` at the root therefore 404s EVERY js
    # and css file while `index.html` itself returns 200 — which renders as a
    # blank page stuck on the loading screen, with nothing in the browser
    # console pointing at the cause.
    #
    # Mapped here rather than by changing `assetsPublicPath`, because that
    # setting is how the upstream project serves assets from a CDN prefix and
    # changing it would be editing vendored build config to suit our host.
    # `^~` is load-bearing. nginx evaluates REGEX locations before prefix ones,
    # so the `\.(js|css|...)$` block below was winning this URL and serving it
    # from the root — 404 for every bundle while index.html returned 200, which
    # renders as a page stuck forever on its loading spinner. `^~` tells nginx
    # to stop at this prefix and never consult the regex blocks.
    location ^~ /static/ {
        alias /usr/share/nginx/html/;
        try_files $uri =404;
    }

    # The SPA owns its routes. Vue Router uses history mode, so a hard
    # navigation or refresh on /exchange/btc_usdt must return index.html rather
    # than 404 — the router cannot handle a route the server never delivered.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Everything the platform serves goes through svc-edge, and ONE entry, not
    # one per service. The edge owns the route table, exchanges a bearer token
    # for a principal the services will believe, and 404s any prefix it does not
    # recognise. A proxy entry per service would bypass all three, and nothing
    # here would know svc-bank is on 4009.
    location /api/ {
        proxy_pass http://svc-edge:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Live depth, trades and positions. `Upgrade`/`Connection` are the whole
    # point — without them the socket is silently downgraded to a normal request
    # and the book simply never streams, with nothing in any log to say why.
    location /ws {
        proxy_pass http://svc-ws:4014;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
    }

    # Hashed filenames, so these are safe to cache hard. index.html is NOT —
    # caching it pins users to a stale bundle that references assets a later
    # deploy has already deleted.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
