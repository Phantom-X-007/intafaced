name: prettier-seize
on:
  push:
    branches:
      - feat/bank-loan-seize-missing-mark
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prettier seize throw
        run: python3 scripts/prettier-seize.py
      - name: Commit and remove one-shot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/prettier-seize.yml scripts/prettier-seize.py
          git add services/svc-bank/src/loans/loan-service.ts
          git commit -m "style(svc-bank): prettier seize BankError throw"
          git push
