# Serving config for the vendored trading shell.
#
# Two jobs: serve an SPA, and proxy the API to svc-edge so the browser stays
# same-origin. Same-origin matters more than it looks — it is why there is no
# CORS preflight and why the session cookie is actually carried.

# `Connection: upgrade` ONLY when the client actually asked to upgrade.
#
# Hardcoding `Connection "upgrade"` is the recipe everyone copies, and it sends
# that header on the plain GETs that share this prefix (the depth snapshot the
# client resnapshots from). This maps the empty `Upgrade` header to `close`, so
# a normal request is a normal request and a websocket is still a websocket.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    # IPv6 too, and this line is the difference between the container being
    # `healthy` and being `unhealthy` forever.
    #
    # The compose healthcheck is `wget -qO- http://localhost/`. Inside the
    # container `localhost` resolves to `::1` first, nginx was listening on
    # 0.0.0.0 only, and the probe got "Connection refused" on every attempt —
    # while the very same page answered 200 on :8090 from the host. A fleet that
    # reports a serving container as unhealthy is worse than one that reports
    # nothing: `depends_on: service_healthy` never releases, and `compose ps`
    # says the shell is down when it is up.
    #
    # The nginx image normally patches this itself in
    # `10-listen-on-ipv6-by-default.sh`, but that script checksums
    # /etc/nginx/conf.d/default.conf against the packaged one and skips when they
    # differ. We replace that file, so it always skips — the log line is
    # `info: /etc/nginx/conf.d/default.conf differs from the packaged version`,
    # which reads like a note and is actually the cause.
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The built bundle is emitted to `dist/assets/`, but webpack's
    # `assetsPublicPath` is `/static/`, so every generated URL is
    # `/static/assets/...`. Serving `dist` at the root therefore 404s EVERY js
    # and css file while `index.html` itself returns 200 — which renders as a
    # blank page stuck on the loading screen, with nothing in the browser
    # console pointing at the cause.
    #
    # Mapped here rather than by changing `assetsPublicPath`, because that
    # setting is how the upstream project serves assets from a CDN prefix and
    # changing it would be editing vendored build config to suit our host.
    # `^~` is load-bearing. nginx evaluates REGEX locations before prefix ones,
    # so the `\.(js|css|...)$` block below was winning this URL and serving it
    # from the root — 404 for every bundle while index.html returned 200, which
    # renders as a page stuck forever on its loading spinner. `^~` tells nginx
    # to stop at this prefix and never consult the regex blocks.
    location ^~ /static/ {
        alias /usr/share/nginx/html/;
        try_files $uri =404;
    }

    # The SPA owns its routes. Vue Router uses history mode, so a hard
    # navigation or refresh on /exchange/btc_usdt must return index.html rather
    # than 404 — the router cannot handle a route the server never delivered.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Everything the platform serves goes through svc-edge, and ONE entry, not
    # one per service. The edge owns the route table, exchanges a bearer token
    # for a principal the services will believe, and 404s any prefix it does not
    # recognise. A proxy entry per service would bypass all three, and nothing
    # here would know svc-bank is on 4009.
    location /api/ {
        proxy_pass http://svc-edge:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Live depth, trades and positions.
    #
    # ── The trailing slash is the fix ──────────────────────────────────────
    #
    # This block used to read `location /ws { proxy_pass http://svc-ws:4014; }`.
    # A `proxy_pass` with NO URI part passes the request path through unchanged,
    # so `/ws/stream` was forwarded to svc-ws as `/ws/stream` — and svc-ws serves
    # `/stream` and `/private/stream` (`ws/gateway.ts` STREAM_PATH,
    # `private/gateway.ts`). Every upgrade got a 404 from a service that was
    # healthy, listening and correct, which is the worst kind of 404 to debug.
    #
    # `proxy_pass http://svc-ws:4014/;` — with the slash — makes nginx replace
    # the matched prefix with that URI, so:
    #
    #     /ws/stream?market=<uuid>   →  /stream?market=<uuid>
    #     /ws/private/stream         →  /private/stream
    #     /ws/markets/<uuid>/depth   →  /markets/<uuid>/depth   (REST snapshot)
    #
    # ── Why `^~` ────────────────────────────────────────────────────────────
    #
    # Same reason as `/static/` above: nginx evaluates regex locations before
    # prefix ones, and `^~` stops that. Without it the `\.(js|css|…)$` block
    # below can win a websocket URL that happens to end in a matching suffix.
    # It also has to out-match `location /`, which it does — nginx takes the
    # longest prefix — but a route this load-bearing should not depend on the
    # reader knowing that.
    #
    # ── Upgrade headers ─────────────────────────────────────────────────────
    #
    # `Upgrade`/`Connection` are the whole point — without them the socket is
    # silently downgraded to a normal request and the book never streams, with
    # nothing in any log to say why. `$connection_upgrade` (mapped at the top of
    # this file) keeps the plain GETs on this prefix from claiming an upgrade
    # they did not ask for.
    location ^~ /ws/ {
        proxy_pass http://svc-ws:4014/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A quiet market must not look like a dead socket. svc-ws pings every 30s
        # by default, so this only ever fires on a connection that is genuinely
        # gone; buffering off so a depth frame is not held for a full buffer.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Hashed filenames, so these are safe to cache hard. index.html is NOT —
    # caching it pins users to a stale bundle that references assets a later
    # deploy has already deleted.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
