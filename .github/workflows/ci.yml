name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  gates:
    name: Doctrine gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # These run first and independently: a branding leak or a custody
      # violation is not something to discover after a ten-minute test run.
      - name: Brand scan (Doctrine §0.7)
        run: pnpm scan:brand
      - name: Custody scan (Doctrine §16.10)
        run: pnpm scan:custody
      - name: Vendor shell residue (mass-credit / CORS *)
        run: pnpm scan:vendor-shell
      - name: Workspace sync
        run: pnpm scan:workspace
      - name: Migration check (§14)
        run: pnpm db:check

      # A tracker that drifts from the code is worse than no tracker. This
      # fails if docs/TRACKER.md is stale, or if a feature claims "done" while
      # the service it lives in does not exist.
      - name: Tracker is honest
        run: pnpm tracker:check

  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm format:check

  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: intafaced
          POSTGRES_PASSWORD: intafaced
          POSTGRES_DB: intafaced
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U intafaced"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

      nats:
        image: nats:2.10-alpine
        ports: ['4222:4222', '8222:8222']

    env:
      TEST_DATABASE_URL: postgres://intafaced:intafaced@localhost:5432/intafaced
      REDIS_URL: redis://localhost:6379
      NATS_URL: nats://localhost:4222

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Bootstrap service schemas and roles
        run: |
          PGPASSWORD=intafaced psql -h localhost -U intafaced -d intafaced \
            -f tooling/infra/postgres-init/01-service-schemas.sql

      - run: pnpm test

  dod:
    name: Definition of Done
    runs-on: ubuntu-latest
    needs: [gates, build, test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # §0.1 — never half done. This is the gate that decides whether a module
      # ships, and it runs on every PR so nothing "temporary" reaches main.
      - run: pnpm gate
