# Vendor compile probe (Axis C2 residual — #1137 shipped Dependabot only).
#
# Promise (docs/AXIS-IMPROVEMENT-PLAN-2026-08-08.md §A2 item 2):
#   mvn -q -DskipTests compile over the vendored framework, on PRs that touch
#   vendor/**, continue-on-error: true. Reporting only — never a required check.
#
# Why path-filtered is safe here: this is NOT a required status. Supply-chain
# must run on every PR because a required check that path-filters itself leaves
# PRs pending forever. This job is advisory; path filter = no wasted minutes.
#
# What it proves: the scanned Java source still parses / packages under the
# toolchain the ADR pins (OpenJDK 8 + Maven 3.8). That is the rebuild path.
# It does NOT prove a running JVM is safe, does NOT publish artifacts to the
# monorepo, and does NOT add jars to force a boot. A green package here is
# still not a substitute for the dual-book source gates — and a green source
# gate is still not jar truth (D-S-17 / D26-P2-07).
#
# If compile/package would need a new jar vendored or published: stop — owner
# gate (ADR 2026-08-04: do not add a jar to make something boot).
name: Vendor compile probe

on:
  pull_request:
    paths:
      - 'vendor/**'
      - '.github/workflows/vendor-compile.yml'
      - 'tooling/scripts/vendor-java-rebuild.mjs'
      - 'tooling/ci/vendor-java-jar-truth.mjs'
  workflow_dispatch:

concurrency:
  group: vendor-compile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile-framework-core:
    name: Compile framework (core)
    runs-on: ubuntu-latest
    # Reporting only. A red line here is a signal for the Dependabot merger,
    # not a merge block — dual-book residual and Spring EOL make full green
    # compile a long-horizon goal, not a gate that freezes the monorepo.
    continue-on-error: true
    container:
      # Pin matches docs/adr/2026-07-28-vendored-exchange-integration.md
      image: maven:3.8.8-eclipse-temurin-8
    defaults:
      run:
        working-directory: vendor/upstream-exchange/00_framework
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compile core module (skip tests)
        # maven:*-temurin image default shell is dash (/bin/sh). `set -o pipefail`
        # is a bashism and aborts the step with exit 2 before mvn runs — which made
        # Dependabot #1142 look "compile-red" with zero Java signal (2026-08-09 log:
        # `set: Illegal option -o pipefail`). Use bash so the probe actually compiles.
        shell: bash
        run: |
          set -euo pipefail
          echo "Vendor compile probe — core only (path-filtered, continue-on-error)"
          echo "Note: source scan ≠ runtime safety; this step is compile evidence only"
          mvn -B -q -pl core -am -DskipTests compile
          echo "✓ vendor compile probe: framework core compiled"

  # D26-P2-07 / D-S-17: rebuild path real — package the jars compose would run
  # from the same scanned source the money scan walks. Advisory (continue-on-
  # error): Spring EOL + otc packaging debt must not freeze the monorepo, but
  # the path must exist and be exercised in CI rather than only documented.
  # Module list must stay aligned with tooling/scripts/vendor-java-rebuild.mjs
  # (compose inventory); jar-truth fails if this job loses `package`.
  package-compose-jars:
    name: Package compose jars (rebuild path)
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: maven:3.8.8-eclipse-temurin-8
    defaults:
      run:
        working-directory: vendor/upstream-exchange/00_framework
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Package compose jars from scanned source
        shell: bash
        run: |
          set -euo pipefail
          echo "Vendor jar rebuild — compose modules from scanned source"
          echo "Jar truth rule: source scan alone is not runtime safety (ADR 2026-08-04)"
          echo "Local equivalent: pnpm vendor-java:rebuild (tooling/scripts/vendor-java-rebuild.mjs)"
          # Keep in sync with composeJarModules() in vendor-java-rebuild.mjs
          mvn -B -q -pl cloud,exchange,exchange-api,market,otc-api,ucenter-api -am -DskipTests package
          echo "✓ vendor jar rebuild: compose modules packaged from scanned source"
