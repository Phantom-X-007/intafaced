name: oneshot-totp-enrol-refuse

on:
  push:
    branches: [feat/svc-identity-totp-enrol-refuse-blank-key]
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Refuse TOTP enrol when IDENTITY_TOTP_SECRET_KEY is blank
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path("services/svc-identity/src/auth/auth-service.ts")
          src = p.read_text()
          start = src.find("  async startTotpEnrolment(")
          end = src.find("  async confirmTotpEnrolment(")
          if start < 0 or end <= start:
              raise SystemExit("startTotpEnrolment not found")
          body = src[start:end]
          if "auth.totp_key_missing" in body:
              print("startTotpEnrolment already refuses a blank key")
          else:
              needle = "  async startTotpEnrolment(userId: string): Promise<{ secret: string; uri: string; recoveryCodes: string[] }> {\n    const rows = await this.sql"
              insert = (
                  "  async startTotpEnrolment(userId: string): Promise<{ secret: string; uri: string; recoveryCodes: string[] }> {\n"
                  "    // Refuse before inventing a secret the confirm path cannot seal.\n"
                  "    if (!this.totpSecretKey) {\n"
                  "      throw new AuthError(\n"
                  "        'IDENTITY_TOTP_SECRET_KEY is not set to a 32-byte key (base64 or hex) — cannot enrol TOTP',\n"
                  "        'auth.totp_key_missing',\n"
                  "      );\n"
                  "    }\n"
                  "\n"
                  "    const rows = await this.sql"
              )
              if needle not in src:
                  raise SystemExit("startTotpEnrolment anchor missing")
              src = src.replace(needle, insert, 1)
              p.write_text(src)
              print("patched startTotpEnrolment")
          PY
      - name: Commit patch and self-delete
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/oneshot-totp-enrol-refuse.yml
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "svc-identity: refuse TOTP enrol when IDENTITY_TOTP_SECRET_KEY is blank"
          git push
