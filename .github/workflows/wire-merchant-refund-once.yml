name: wire-merchant-refund-once
on:
  push:
    branches: [feat/pay-merchant-refund-captured]
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pay-merchant-refund-captured
      - name: apply patch and self-delete
        run: |
          set -euo pipefail
          if [ ! -f services/svc-pay/scripts/merchant-refund.patch ]; then
            echo "patch already applied"
            exit 0
          fi
          git apply services/svc-pay/scripts/merchant-refund.patch
          rm -f services/svc-pay/scripts/merchant-refund.patch
          rm -f .github/workflows/wire-merchant-refund-once.yml
          git config user.name "Sovereign Builder"
          git config user.email "intafaced@gmail.com"
          git add -A
          git commit -m "feat(svc-pay): merchant refund of captured payment through ledger-client"
          git push
