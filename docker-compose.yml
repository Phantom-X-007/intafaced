name: intafaced

services:
  postgres:
    image: postgres:16-alpine
    container_name: intafaced-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: intafaced
      POSTGRES_PASSWORD: intafaced
      POSTGRES_DB: intafaced
      # Ledger is law (§0.6) — deterministic numeric behaviour across machines.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    command:
      - postgres
      - -c
      - max_connections=200
      # Ledger posts run SERIALIZABLE; keep the snapshot machinery honest.
      - -c
      - default_transaction_isolation=read committed
      - -c
      - shared_preload_libraries=pg_stat_statements
    ports:
      # Host 5433 — a native Postgres commonly owns 5432, and the platform DB
      # must never depend on that slot being free. Container-internal is 5432.
      - '${POSTGRES_HOST_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./tooling/infra/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U intafaced -d intafaced']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: intafaced-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      # Host 6380 for the same reason as Postgres above — a local Redis often
      # owns 6379. Container-internal stays 6379.
      - '${REDIS_HOST_PORT:-6380}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2.10-alpine
    container_name: intafaced-nats
    restart: unless-stopped
    command:
      - '--jetstream'
      - '--store_dir=/data'
      - '--http_port=8222'
      - '--name=intafaced-nats'
    ports:
      - '4222:4222' # client
      - '8222:8222' # monitoring
    volumes:
      - natsdata:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O- http://localhost:8222/healthz || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    container_name: intafaced-otel
    restart: unless-stopped
    command: ['--config=/etc/otel/config.yaml']
    volumes:
      - ./tooling/infra/otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - '4317:4317' # OTLP gRPC
      - '4318:4318' # OTLP HTTP
    depends_on:
      - tempo
      - prometheus

  tempo:
    image: grafana/tempo:2.6.1
    container_name: intafaced-tempo
    restart: unless-stopped
    command: ['-config.file=/etc/tempo/tempo.yaml']
    volumes:
      - ./tooling/infra/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempodata:/var/tempo
    ports:
      - '3200:3200'

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: intafaced-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yaml'
      - '--web.enable-remote-write-receiver'
      - '--enable-feature=exemplar-storage'
    volumes:
      - ./tooling/infra/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - promdata:/prometheus
    ports:
      - '9090:9090'

  grafana:
    image: grafana/grafana:11.4.0
    container_name: intafaced-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: intafaced
      GF_SECURITY_ADMIN_PASSWORD: intafaced
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - ./tooling/infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    ports:
      - '3001:3000'
    depends_on:
      - prometheus
      - tempo

volumes:
  pgdata:
  redisdata:
  natsdata:
  promdata:
  tempodata:
  grafanadata:
