name: oneshot-kyc-doc-put-refuse

on:
  push:
    branches: [feat/svc-identity-kyc-doc-put-refuse-blank-key]
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: requireKey first on both KYC put paths
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path("services/svc-identity/src/kyc/document-store.ts")
          src = p.read_text()
          old = """  async put(input: PutDocumentInput): Promise<StoredDocumentMeta> {
    if (!input.contentType || input.contentType.length > 128 || /[\r\n]/.test(input.contentType)) {
      throw new KycDocumentError('Invalid content type', 'kyc_doc.bad_content_type');
    }
    if (input.bytes.length === 0 || input.bytes.length > MAX_BYTES) {
      throw new KycDocumentError(`Document must be 1..${MAX_BYTES} bytes`, 'kyc_doc.too_large');
    }
    const storedBy = input.storedBy?.trim() ? input.storedBy.trim() : null;
    const key = this.requireKey();
"""
          new = """  async put(input: PutDocumentInput): Promise<StoredDocumentMeta> {
    // Refuse before any validation write-up — no invented key, no ciphertext.
    const key = this.requireKey();
    if (!input.contentType || input.contentType.length > 128 || /[\r\n]/.test(input.contentType)) {
      throw new KycDocumentError('Invalid content type', 'kyc_doc.bad_content_type');
    }
    if (input.bytes.length === 0 || input.bytes.length > MAX_BYTES) {
      throw new KycDocumentError(`Document must be 1..${MAX_BYTES} bytes`, 'kyc_doc.too_large');
    }
    const storedBy = input.storedBy?.trim() ? input.storedBy.trim() : null;
"""
          n = src.count(old)
          if src.count("Refuse before any validation write-up") >= 2:
              print("already patched")
          elif n != 2:
              raise SystemExit(f"put anchor count {n}, expected 2")
          else:
              p.write_text(src.replace(old, new))
              print("patched both put() paths")
          PY
      - name: Commit patch and self-delete
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/oneshot-kyc-doc-put-refuse.yml
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "svc-identity: KYC put refuses a blank IDENTITY_KYC_DOC_KEY first"
          git push
