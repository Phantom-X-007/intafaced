name: oneshot-kyc-doc-get-refuse

on:
  push:
    branches: [feat/svc-identity-kyc-doc-get-refuse-blank-key]
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: mount kyc.getDocument after storeDocument
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path("services/svc-identity/src/router.ts")
          src = p.read_text()
          if "getDocument: scopedProcedure('admin:compliance')" in src:
              print("already patched")
          else:
              old = """      /**
       * Meta-only list for one subject. No document bytes on the wire.
       * Compliance scope only — not a free userId lookup for ordinary sessions.
       */
      listDocuments: scopedProcedure('admin:compliance')"""
              new = """      /**
       * §10 — operator opens one KYC document through IDENTITY_KYC_DOC_KEY.
       *
       * Decrypts only for a compliance principal. Blank key refuses first —
       * no invented AES key, no plaintext. MFA required (same class as store).
       */
      getDocument: scopedProcedure('admin:compliance')
        .input(z.object({ documentId: z.string().uuid() }))
        .output(kycDocMetaOutput.extend({ bytesBase64: z.string() }))
        .mutation(async ({ ctx, input }) => {
          try {
            requireMfa(ctx.principal);
            const vault = requireKycDocs();
            const opened = await vault.getFor(input.documentId, {
              kind: 'compliance',
              operatorId: ctx.principal.userId,
            });
            return {
              ...presentDocMeta(opened.meta),
              bytesBase64: opened.bytes.toString('base64'),
            };
          } catch (err) {
            throw toTrpcError(err);
          }
        }),

      /**
       * Meta-only list for one subject. No document bytes on the wire.
       * Compliance scope only — not a free userId lookup for ordinary sessions.
       */
      listDocuments: scopedProcedure('admin:compliance')"""
              if old not in src:
                  raise SystemExit("listDocuments anchor missing")
              p.write_text(src.replace(old, new, 1))
              print("mounted kyc.getDocument")
          PY
      - name: Commit patch and self-delete
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/oneshot-kyc-doc-get-refuse.yml
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "svc-identity: mount kyc.getDocument through IDENTITY_KYC_DOC_KEY"
          git push
