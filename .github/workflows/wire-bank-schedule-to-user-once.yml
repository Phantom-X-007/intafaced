name: wire-bank-schedule-to-user-once
on:
  push:
    branches: [feat/bank-schedule-to-user]
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bank-schedule-to-user
      - name: apply python edits and self-delete
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path

          p = Path('services/svc-bank/src/transfers/transfer-service.ts')
          t = p.read_text()
          old = """  // ── Standing orders ────────────────────────────────────────────────────────\n\n  async schedule(input: {"""
          new = """  // ── Standing orders ────────────────────────────────────────────────────────\n\n  async scheduleToUser(input: {\n    userId: string;\n    fromSpaceId: string;\n    toUserId: string;\n    amount: Amount;\n    cadence: Cadence;\n    startsAt: Date;\n    endsAt?: Date | null;\n  }): Promise<ScheduleRecord> {\n    const destUserId = input.toUserId.trim();\n    const from = await this.spaces.get(input.fromSpaceId);\n    const dest = destUserId ? await this.spaces.findPrimary(destUserId, from.assetId) : null;\n    if (!dest) {\n      throw new BankError(\n        `Dest user ${destUserId || '(empty)'} has no primary ${from.assetId} space — schedule refused`,\n        'bank.dest_user_missing',\n      );\n    }\n    return this.schedule({\n      userId: input.userId,\n      fromSpaceId: input.fromSpaceId,\n      toSpaceId: dest.id,\n      amount: input.amount,\n      cadence: input.cadence,\n      startsAt: input.startsAt,\n      endsAt: input.endsAt,\n    });\n  }\n\n  async schedule(input: {"""
          if old not in t:
              raise SystemExit('transfer-service anchor missing')
          p.write_text(t.replace(old, new, 1))

          p = Path('services/svc-bank/src/router.ts')
          t = p.read_text()
          old = """    schedule: scopedProcedure('bank:write', { module: 'bank' })\n      .input(\n        z.object({\n          fromSpaceId: z.string().uuid(),\n          toSpaceId: z.string().uuid(),"""
          new = """    scheduleToUser: scopedProcedure('bank:write', { module: 'bank' })\n      .input(\n        z.object({\n          fromSpaceId: z.string().uuid(),\n          toUserId: z.string().min(1).max(64),\n          amount: amountString,\n          cadence: z.enum(['daily', 'weekly', 'monthly']),\n          startsAt: z.string().datetime({ offset: true }),\n          endsAt: z.string().datetime({ offset: true }).optional(),\n        }),\n      )\n      .output(z.object({ id: z.string(), nextRunAt: z.string() }))\n      .mutation(async ({ ctx, input }) =>\n        guard(async () => {\n          const from = await bank.spaces.get(input.fromSpaceId);\n          assertSelf(ctx.principal.userId, from.userId);\n          const schedule = await bank.transfers.scheduleToUser({\n            userId: ctx.principal.userId,\n            fromSpaceId: input.fromSpaceId,\n            toUserId: input.toUserId,\n            amount: parseAmount(input.amount),\n            cadence: input.cadence,\n            startsAt: new Date(input.startsAt),\n            endsAt: input.endsAt ? new Date(input.endsAt) : null,\n          });\n          return { id: schedule.id, nextRunAt: schedule.nextRunAt.toISOString() };\n        }),\n      ),\n\n    schedule: scopedProcedure('bank:write', { module: 'bank' })\n      .input(\n        z.object({\n          fromSpaceId: z.string().uuid(),\n          toSpaceId: z.string().uuid(),"""
          if old not in t:
              raise SystemExit('router schedule anchor missing')
          p.write_text(t.replace(old, new, 1))

          p = Path('services/svc-bank/src/bank-service.test.ts')
          t = p.read_text()
          old = """      return { primary, rent, schedule };\n    }\n\n    it('fires ONCE even when the job runs twice', async () => {"""
          new = """      return { primary, rent, schedule };\n    }\n\n    it('refuses standing order to a dest user with no primary — no row, nothing posted', async () => {\n      const a = await bank.spaces.ensurePrimary(USER_A, 'USDT');\n      await fund(USER_A, 'USDT', '50');\n      const journalBefore = ledger.journal().map((tx) => tx.idempotencyKey);\n      await expect(\n        bank.transfers.scheduleToUser({\n          userId: USER_A,\n          fromSpaceId: a.id,\n          toUserId: USER_C,\n          amount: amt('10'),\n          cadence: 'monthly',\n          startsAt: new Date('2026-01-01T09:00:00Z'),\n        }),\n      ).rejects.toMatchObject({ code: 'bank.dest_user_missing' });\n      const rows = await sql`SELECT id FROM bank.scheduled_transfers`;\n      expect(rows).toHaveLength(0);\n      expect(ledger.journal().map((tx) => tx.idempotencyKey)).toEqual(journalBefore);\n      expect(await availableOf(USER_A, 'USDT')).toBe('50');\n    });\n\n    it('schedules to the dest user and fires through ledger-client', async () => {\n      const a = await bank.spaces.ensurePrimary(USER_A, 'USDT');\n      await bank.spaces.ensurePrimary(USER_B, 'USDT');\n      await fund(USER_A, 'USDT', '100');\n      const schedule = await bank.transfers.scheduleToUser({\n        userId: USER_A,\n        fromSpaceId: a.id,\n        toUserId: USER_B,\n        amount: amt('25'),\n        cadence: 'monthly',\n        startsAt: new Date('2026-01-01T09:00:00Z'),\n      });\n      const now = new Date('2026-01-01T10:00:00Z');\n      const report = await bank.transfers.runDueTransfers({ now });\n      expect(report.settled).toBe(1);\n      expect(ledger.journal().some((tx) => tx.idempotencyKey.includes(schedule.id))).toBe(true);\n      expect(await availableOf(USER_A, 'USDT')).toBe('75');\n      expect(await availableOf(USER_B, 'USDT')).toBe('25');\n      expect(ledger.reconcile()).toEqual({ ok: true });\n    });\n\n    it('fires ONCE even when the job runs twice', async () => {"""
          if old not in t:
              raise SystemExit('test anchor missing')
          p.write_text(t.replace(old, new, 1))
          print('applied')
          PY
          rm -f .github/workflows/wire-bank-schedule-to-user-once.yml
          git config user.name "Sovereign Builder"
          git config user.email "intafaced@gmail.com"
          git add -A
          git commit -m "feat(svc-bank): standing order to dest user through ledger-client"
          git push
