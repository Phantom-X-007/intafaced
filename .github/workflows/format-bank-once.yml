name: format-bank-once
on:
  push:
    paths:
      - .github/workflows/format-bank-once.yml
jobs:
  fmt:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bank-crypto-withdraw-stored-evm
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prettier the four bank files
        run: pnpm exec prettier --write services/svc-bank/src/ramps/ramp-service.ts services/svc-bank/src/ramps/ramps.test.ts services/svc-bank/src/withdraw-destination.ts services/svc-bank/src/withdraw-destination.test.ts
      - name: Commit prettier and self-delete
        run: |
          git config user.name "Sovereign Builder"
          git config user.email "intafaced@gmail.com"
          git rm -f .github/workflows/format-bank-once.yml
          git add services/svc-bank/src
          git commit -m "style(svc-bank): prettier crypto-withdraw files"
          git push origin HEAD:feat/bank-crypto-withdraw-stored-evm
