name: CI

on:
  # RESTORED 2026-08-07: push:main is back.
  #
  # It was removed on 2026-08-04 as a thrift measure, to stop "double-billing"
  # a merge out of "a 2,000-minute monthly pool". That pool was a private-repo
  # quota. This repo is PUBLIC, and GitHub Actions on standard runners are free
  # and unlimited for public repositories — the bill it protected does not exist.
  #
  # What it cost while it was off: nothing verified main after a merge. Two PRs
  # that each passed independently could land and leave the trunk red, on a repo
  # that moves money. That is exactly what #901 ("main is red") and #221 were.
  # A PR check proves the branch was green; only a push check proves the trunk is.
  #
  # ONE MARKDOWN FILE IS NOT DOCUMENTATION. INTAFACED_DEFINITIVE_BUILD.md is
  # the law, and coverage-check reads it: a chapter appearing there is exactly
  # the event that gate exists to catch. Under a blanket `**/*.md` ignore,
  # adding §39 would skip CI entirely and no gate would ever see it — which is
  # a fair description of how §27–§37 arrived with nobody noticing. Negation
  # needs `paths` rather than `paths-ignore`; the last matching pattern wins.
  # That path filter stays: it is about relevance, not cost.
  push:
    branches: [main]
  pull_request:
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - '!NOTICE'
      - '!LICENSE'
      - INTAFACED_DEFINITIVE_BUILD.md
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  gates:
    name: Doctrine gates
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — the value-gate step at the end of this job needs
      # `origin/main` and ten ancestor subjects. The default is 1, which gives
      # it neither, and a gate that can see nothing must never print clean.
      # 49 MiB of pack for 818 commits; the pnpm install below costs more.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # ONE STEP, ON PURPOSE — and this is the point of the change.
      #
      # This was eleven hand-written steps. `pnpm verify` kept its own separate
      # list in package.json, and the two were maintained by nobody in
      # particular. They drifted: `scan:dual-book-door-paths` and `scan:test-db`
      # ran here and nowhere local, so an engineer could run `pnpm verify`
      # green, push, and land red on a gate they had no local way of running.
      # AGENTS.md tells every human and every agent that verify is the
      # pre-flight check. That promise only holds if verify runs what this job
      # runs, and the only way to guarantee that is one list.
      #
      # `tooling/ci/gates.mjs` is that list. It fails if this workflow stops
      # calling it, and it fails if a scan appears in tooling/ci/ that neither
      # the gate list nor the documented exclusions claim — which is how
      # i18n-scan.mjs sat wired to nothing for weeks. Individual scans keep
      # their `pnpm scan:*` scripts for running one at a time.
      #
      # It also de-duplicates: six of these scans used to run twice per CI run,
      # once here and again inside dod-gate.mjs in the `dod` job below.
      #
      # Still first, still its own job: a branding leak or a custody violation
      # is not something to discover after a ten-minute test run. The runner
      # does not stop at the first failure, so every broken gate shows up in one
      # run rather than one per push.
      - name: Doctrine gates (the same list `pnpm verify` runs)
        run: pnpm gates

      # THE STAMP-MILL GATE, CODE HALF — and deliberately NOT inside gates.mjs.
      #
      # It lived only on `docs-format.yml`, which fires only on markdown. Its
      # blocking condition also led with `docsOnly`, so subject similarity was
      # never evaluated on anything that touched source. #832–#876 — forty-five
      # PRs, same title shape, source + tests + one slice doc each — walked
      # straight through both halves of that hole. Wiring it here closes the
      # second half: a PR with no markdown in it never reaches docs-format at
      # all, so a mill that simply stopped writing slice docs would be invisible.
      #
      # NOT a gates.mjs entry, for the reason its NOT_GATES note has always
      # given and which is now doubly true: it needs a CURRENT `origin/main` and
      # real ancestry, which a laptop `pnpm verify` cannot promise, and failing
      # someone's local verify because their fetch is a day old is how a gate
      # gets deleted. `pnpm value-gate:self-test` is the local pre-flight.
      #
      # Warn-before-block is inside the rule, not in this flag: a first
      # near-duplicate warns in the log and exits 0; the fourth consecutive one
      # blocks. Escape is an auditable `Serial-Work:` commit trailer.
      - name: value gate (code stamp-mill)
        env:
          VALUE_GATE_STRICT: '1'
        run: node tooling/ci/value-gate.mjs

  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm format:check

  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: intafaced
          POSTGRES_PASSWORD: intafaced
          POSTGRES_DB: intafaced
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U intafaced"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      # Residual #9: every money suite must hit real Postgres on CI — not skip.
      # Local defaults use :5433 + svc_* users; CI is :5432 after bootstrap.
      # Use 127.0.0.1 (not localhost) so Node does not try IPv6 ::1 before PG is up.
      CI: true
      REQUIRE_POSTGRES: '1'
      # Target `intafaced_test`, not `intafaced`, even though CI's Postgres is a
      # throwaway container where nothing could be harmed. Two reasons it still
      # matters: `assertTestDatabase` refuses any database not ending in `_test`,
      # so CI must satisfy the same rule it enforces on developers; and CI is the
      # only place that proves the isolated database is actually bootstrappable.
      # A green CI on the shared name would tell us nothing about the path every
      # developer runs.
      TEST_DATABASE_URL: postgres://intafaced:intafaced@127.0.0.1:5432/intafaced_test
      TEST_DATABASE_URL_PAY: postgres://svc_pay:svc_pay@127.0.0.1:5432/intafaced_test
      TEST_DATABASE_URL_IDENTITY: postgres://svc_identity:svc_identity@127.0.0.1:5432/intafaced_test
      TEST_DATABASE_URL_TOKEN: postgres://svc_token:svc_token@127.0.0.1:5432/intafaced_test
      TEST_DATABASE_URL_TRADE: postgres://svc_trade:svc_trade@127.0.0.1:5432/intafaced_test
      TEST_DATABASE_URL_P2P: postgres://svc_p2p:svc_p2p@127.0.0.1:5432/intafaced_test
      TEST_DATABASE_URL_BANK: postgres://svc_bank:svc_bank@127.0.0.1:5432/intafaced_test
      TEST_DATABASE_URL_BLUEPRINT: postgres://svc_blueprint:svc_blueprint@127.0.0.1:5432/intafaced_test
      TEST_DATABASE_URL_AGENTS: postgres://svc_agents:svc_agents@127.0.0.1:5432/intafaced_test
      TEST_DATABASE_URL_NOTIFY: postgres://svc_notify:svc_notify@127.0.0.1:5432/intafaced_test
      TEST_DATABASE_URL_SUPPORT: postgres://svc_support:svc_support@127.0.0.1:5432/intafaced_test
      REDIS_URL: redis://127.0.0.1:6379
      NATS_URL: nats://127.0.0.1:4222
      # Same bargain as REQUIRE_POSTGRES, for the same reason. svc-protocol's
      # CREATE2 cross-check is the one test that proves an address shown to a
      # user is the address the factory will deploy to; it skips on a laptop
      # with no chain and must NEVER skip here.
      REQUIRE_EVM_CHAIN: '1'
      PROTOCOL_RPC_URL: http://127.0.0.1:8545
      # svc-indexer's non-destructive adapter suite shares 8545. Its reorg suite
      # does not, and must not — see the `evm-reorg` step below.
      INDEXER_RPC_URL: http://127.0.0.1:8545
      INDEXER_REORG_RPC_URL: http://127.0.0.1:8546

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Bootstrap service schemas and roles
        run: |
          PGPASSWORD=intafaced psql -h localhost -U intafaced -d intafaced \
            -f tooling/infra/postgres-init/01-service-schemas.sql
          # ops role used by some ledger/indexer suites for CREATE SCHEMA
          PGPASSWORD=intafaced psql -h localhost -U intafaced -d intafaced -c \
            "GRANT CREATE ON DATABASE intafaced TO intafaced_ops; ALTER ROLE intafaced_ops WITH CREATEDB;"

      # Run the SAME init script the local docker fleet runs, rather than a CI
      # transcription of it. That script shipped two silent bugs for a long time
      # (an unquoted heredoc that let bash expand `DO $$` into the shell PID, and
      # `CREATE ROLE IF NOT EXISTS`, which Postgres does not have). Both left
      # `intafaced_test` created but EMPTY of service schemas — which is exactly
      # what pushed suites back onto the shared database. CI never executed this
      # file, so CI could not have caught either bug. Now it does.
      - name: Create and bootstrap the isolated test database
        env:
          POSTGRES_USER: intafaced
          POSTGRES_DB: intafaced
          PGPASSWORD: intafaced
          PGHOST: localhost
        run: bash tooling/infra/postgres-init/02-intafaced-test-db.sh

      - name: Prove the test database is actually populated
        env:
          PGPASSWORD: intafaced
        run: |
          # "Created but empty" was the real failure mode, and it is
          # indistinguishable from success unless something asserts on contents.
          expected=14
          count=$(psql -h localhost -U intafaced -d intafaced_test -tAc \
            "SELECT count(*) FROM pg_namespace WHERE nspname IN ('identity','ledger','token','matching','trade','pay','p2p','blueprint','bank','agents','indexer','protocol','notify','support');")
          echo "service schemas in intafaced_test: $count / $expected"
          if [ "$count" -ne "$expected" ]; then
            echo "::error::intafaced_test missing service schemas ($count/$expected) — 02-intafaced-test-db.sh did not do its job"
            exit 1
          fi

      - name: Prove money-test DB URLs resolve (residual #9)
        run: node tooling/ci/assert-test-db-env.mjs

      # NATS, with JetStream ON.
      #
      # It used to be a `services:` container, and GitHub gives those no way to
      # pass a command — so it ran with JetStream OFF while every service in this
      # repo publishes and consumes through JetStream. `nc.jetstreamManager()`
      # answers 503 on such a server. Nothing noticed for as long as the container
      # has existed, because no test connected to it; the first suite that did
      # (packages/events) failed on exactly that.
      #
      # Same reason and same shape as the EVM chain below. Mirrors the `nats`
      # service in docker-compose.yml, which has always passed `--jetstream`.
      - name: Local NATS with JetStream (§10 event bus)
        run: |
          docker run -d --name intafaced-ci-nats -p 4222:4222 -p 8222:8222 nats:2.10-alpine \
            --jetstream --http_port=8222 --name=intafaced-ci-nats
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8222/healthz >/dev/null; then
              echo "nats answering on 4222, JetStream enabled"
              exit 0
            fi
            sleep 1
          done
          echo "::error::NATS never answered — the JetStream bus suite cannot run"
          docker logs intafaced-ci-nats || true
          exit 1

      # A throwaway EVM for svc-protocol. Started with `docker run` rather than
      # as a `services:` container because GitHub gives service containers no
      # way to pass a command, and the foundry image's entrypoint needs one.
      #
      # DEV ONLY, and ephemeral by construction — the runner is destroyed with
      # the job. Mirrors the `evm` service in docker-compose.yml.
      - name: Local EVM dev chain (§13 socket.evm-rpc)
        run: |
          docker run -d --name intafaced-ci-evm -p 8545:8545 ghcr.io/foundry-rs/foundry:v1.5.1 \
            "anvil --host 0.0.0.0 --port 8545 --chain-id 31337 --accounts 10 --balance 10000 --block-base-fee-per-gas 0 --silent"
          for _ in $(seq 1 30); do
            if curl -sf -X POST -H 'content-type: application/json' \
                 --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId"}' \
                 http://127.0.0.1:8545 | grep -q 0x7a69; then
              echo "dev chain answering on 8545"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the dev chain never answered — REQUIRE_EVM_CHAIN=1 will fail the protocol suite"
          docker logs intafaced-ci-evm || true
          exit 1

      # A SECOND throwaway EVM, for svc-indexer's reorg suite only.
      #
      # That suite proves rows written from an orphaned block do not survive it,
      # which means actually reorging — and `evm_snapshot`/`evm_revert` rewind the
      # whole NODE, not one caller's view of it. Sharing 8545 would rewind
      # svc-protocol's deployed factory out from under its own live tests, and
      # `pnpm test` runs package tasks in parallel, so non-overlap is not
      # something anyone gets to assume. Mirrors the `evm-reorg` service in
      # docker-compose.yml.
      - name: Local EVM dev chain for the reorg suite
        run: |
          docker run -d --name intafaced-ci-evm-reorg -p 8546:8545 ghcr.io/foundry-rs/foundry:v1.5.1 \
            "anvil --host 0.0.0.0 --port 8545 --chain-id 31337 --accounts 10 --balance 10000 --block-base-fee-per-gas 0 --silent"
          for _ in $(seq 1 30); do
            if curl -sf -X POST -H 'content-type: application/json' \
                 --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId"}' \
                 http://127.0.0.1:8546 | grep -q 0x7a69; then
              echo "reorg chain answering on 8546"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the reorg chain never answered — REQUIRE_EVM_CHAIN=1 will fail the indexer suite"
          docker logs intafaced-ci-evm-reorg || true
          exit 1

      # Runs the compiled factory against the TypeScript derivation and prints
      # both. The suite re-proves this hermetically; this step also proves the
      # deploy script itself still works, which nothing else exercises.
      - name: Deploy the smart-account suite and cross-check CREATE2
        run: pnpm --filter @intafaced/svc-protocol chain:deploy

      - run: pnpm test

      # The backstop. REQUIRE_POSTGRES / REQUIRE_EVM_CHAIN make the shared probes
      # throw, which turns most missing infrastructure into a red suite before
      # this step runs. What they cannot cover is a suite whose own required-gate
      # is narrower than the run's — svc-pay's crypto rail gates on
      # REQUIRE_PAY_EVM, which is not set here, so until now it could skip on CI
      # and be counted as a pass. This reads the journal every probe writes and
      # fails the job when something did not execute.
      #
      # `always()` because a red suite is the moment you most want to know how
      # much of the rest was real — the exact question the agent who reported
      # "92 successful, 92 total" could not answer.
      - name: Every infrastructure-backed suite actually ran
        if: always()
        run: node tooling/ci/infra-verdict.mjs

  dod:
    name: Definition of Done
    runs-on: ubuntu-latest
    needs: [gates, build, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # §0.1 — never half done. This is the gate that decides whether a module
      # ships, and it runs on every PR so nothing "temporary" reaches main.
      - run: pnpm gate
