# Dependency updates.
#
# Chosen over self-hosted Renovate for one reason: it costs no Actions minutes
# to FIND an update. Dependabot runs on GitHub's own infrastructure and only
# spends our budget when a PR it opens triggers CI — which is the spend we
# actually want, because that is the run that proves the bump is safe.
#
# GROUPING IS THE WHOLE CONFIG. Ungrouped, a monorepo with 33 workspace packages
# opens dependency PRs faster than anyone reviews them, every one of them burns
# a full CI run, and the thrift law's "prefer path-cluster batches" is violated
# by a bot. Grouped weekly, this is a handful of PRs a month.
#
# See docs/GITHUB-CI-SPEND-CONTROL-2026-07-31.md for the budget this respects.
version: 2

updates:
  # ── npm / pnpm workspace ────────────────────────────────────────────────
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    # Low, on purpose. A queue of bot PRs nobody merges is indistinguishable
    # from no scanning at all, and it costs runner minutes to stay that way.
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    groups:
      # Security fixes travel alone and first — they are the ones worth
      # interrupting a week for, and mixing them into a 40-package bump is how
      # an urgent patch waits behind a major nobody wants.
      security:
        applies-to: security-updates
        patterns: ['*']
      # Everything else batches. Patch and minor together: this repo pins
      # carets already, so a minor is inside the range the lockfile could have
      # resolved to anyway.
      production:
        applies-to: version-updates
        dependency-type: 'production'
        update-types: ['patch', 'minor']
      development:
        applies-to: version-updates
        dependency-type: 'development'
        update-types: ['patch', 'minor']
    ignore:
      # Majors are a human decision. A bot cannot read a CHANGELOG and cannot
      # tell whether an ORM's breaking change touches the money path.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # ── GitHub Actions ──────────────────────────────────────────────────────
  #
  # This is the half that makes SHA pinning survivable. Workflows pin by digest
  # (see .github/workflows/*.yml) so a retagged upstream cannot silently enter
  # the job that builds our images — and this keeps those digests current
  # instead of frozen at whatever was true the day they were pinned.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 2
    commit-message:
      prefix: 'chore(actions)'
    groups:
      actions:
        patterns: ['*']
