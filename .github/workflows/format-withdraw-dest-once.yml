name: format-withdraw-dest-once
on:
  push:
    branches: [feat/bank-user-withdraw-destination]
  workflow_dispatch:
jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: collapse blanks, commit, self-delete
        run: |
          python3 services/svc-bank/scripts/format-withdraw-dest.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "style(svc-bank): prettier withdraw dest blanks"
          git push
