name: prettier-payout-dest-once

on:
  push:
    branches: [feat/pay-merchant-payout-destination]
    paths:
      - '.github/workflows/prettier-payout-dest-once.yml'

jobs:
  fmt:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pay-merchant-payout-destination
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: prettier
        run: npx --yes prettier@3.4.2 --write --config .prettierrc.json services/svc-pay/src/merchant-payout-destination.test.ts services/svc-pay/src/router.ts services/svc-pay/src/db/schema.ts
      - name: commit and drop self
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/prettier-payout-dest-once.yml
          git add services/svc-pay/src/merchant-payout-destination.test.ts services/svc-pay/src/router.ts services/svc-pay/src/db/schema.ts
          git commit -m "style(svc-pay): prettier merchant payout destination"
          git push
