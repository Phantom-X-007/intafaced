# Infrastructure for the vendored CoinExchange (bitrade) platform.
#
# Separate from the root docker-compose.yml on purpose: this is a second stack,
# not an addition to ours. Ours is Postgres + NATS; this is MySQL + MongoDB +
# Redis + Kafka + Zookeeper. Running both is running both.
#
# Ports are offset into the 55xx/56xx range so nothing here collides with the
# services the platform already uses (Postgres 5433, Redis 6380, NATS 4222).
#
# ── Every published port is bound to 127.0.0.1, deliberately ─────────────────
#
# A bare `5506:3306` in compose binds 0.0.0.0 — every interface on the host, not
# just loopback. An audit on 2026-08-02 found MySQL, MongoDB, Redis and Kafka
# all listening on 0.0.0.0 on a running machine.
#
# That is worse here than it would be for our own stack, for three reasons:
#
#   1. NONE of this is referenced by any TypeScript or compose file in the
#      platform. It is a second, unused stack that was left running.
#   2. `custody-scan` walks only `.ts`/`.tsx`, so no doctrine gate has ever read
#      a line of the Java that these datastores back.
#   3. MySQL here has no password on the root account by the source's own
#      configuration, and the Kafka listener does no authentication at all.
#
# So the exposure was: four unauthenticated datastores, on all interfaces,
# belonging to a stack nobody is watching. Nothing in the platform needs them
# reachable from off-box — the Java services talk to them over the compose
# network, which is unaffected by this binding.
#
# If you genuinely need remote access, use an SSH tunnel rather than widening
# this. Changing `127.0.0.1:` back to nothing re-opens all four at once, which
# is exactly how this happened the first time.
#
# ── Versions, and why they are not the ones the source asks for ──────────────
#
# The README specifies MySQL 5.5.16 (2011), Redis 3.2 (EOL 2018), MongoDB 3.6
# (EOL 2021) and Kafka 2.11-2.2.1 (2019). Every one of those is past end of life
# and carries published CVEs. Pinning them to run a crypto exchange would be a
# deliberate choice to deploy known-vulnerable infrastructure.
#
# So these are the closest maintained versions instead. MySQL 8 and MongoDB 6
# are NOT drop-in for 5.5 and 3.6 — expect schema and driver work. That work is
# the honest cost of the upgrade, and it is smaller than the cost of running the
# originals. Anything that will not start here is recorded in
# docs/adr/upstream-exchange-integration.md rather than fixed by downgrading.

services:
  coinex-mysql:
    image: mysql:8.0
    container_name: intafaced-coinex-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${COINEX_MYSQL_PASSWORD:-coinex_dev_only}
      MYSQL_DATABASE: bizzan
    # utf8mb4 rather than the source's utf8: MySQL's "utf8" is three bytes and
    # cannot store an emoji, or a large part of Chinese. The source schema uses
    # utf8 throughout, so this is a deliberate widening.
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    ports:
      - '127.0.0.1:${COINEX_MYSQL_PORT:-5506}:3306'
    volumes:
      - coinex-mysql:/var/lib/mysql
      # NOTHING is mounted at /docker-entrypoint-initdb.d, and that is a finding
      # rather than an omission.
      #
      # The repository does not contain a schema. Nine CREATE TABLE statements
      # in total; `exchange_order`, `member` and `member_transaction` — the core
      # tables of an exchange — are defined nowhere. `db_patch.sql` is a PATCH
      # against a schema that was never published.
      #
      # What actually creates the tables is `spring.jpa.hibernate.ddl-auto=update`
      # over 63 @Entity classes. So the order is: start MySQL empty, boot the
      # Java services (Hibernate builds the schema), and only THEN apply
      # db_patch.sql and member_wallet_trigger.sql — both reference tables that
      # do not exist until Hibernate has run.
      #
      # Loading them at init is what made this container exit on first start:
      # the trigger also needs a DELIMITER change the entrypoint does not do.
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-p${COINEX_MYSQL_PASSWORD:-coinex_dev_only}']
      interval: 5s
      timeout: 5s
      retries: 20

  # ── MongoDB 4.4, and why it is the one exception to "closest maintained" ─────
  #
  # MongoDB 5.1 removed the OP_QUERY wire opcode. The vendored services are
  # Spring Boot 1.5.9 on mongo-java-driver 3.4, which speaks OP_QUERY and
  # nothing else, so every read against a 5.x+ server dies with:
  #
  #   Query failed with error code 352 and error message
  #   'Unsupported OP_QUERY command: find. The client driver may require an
  #   upgrade.' on server coinex-mongo:27017
  #
  # That is what exited `market` — it is a wire-protocol wall, not a config
  # problem, and no amount of connection-string tuning gets past it. The only
  # alternatives are this pin or upgrading the driver inside 14 jars we cannot
  # rebuild here. 4.4 is the newest server that still answers OP_QUERY.
  #
  # Recorded as a deliberate exception to the version policy above rather than
  # left to look like carelessness. It moves off 4.4 when the driver moves.
  #
  # ── The volume is renamed, on purpose ────────────────────────────────────────
  #
  # A data directory written by mongo:6 CANNOT be opened by 4.4 — the server
  # refuses to downgrade the feature compatibility version and exits. Leaving
  # this on `coinex-mongo` would mean the pin is correct in the file and the
  # container still crash-loops on every machine that ever ran the 6 image.
  #
  # So the datastore version and its data directory travel together. The old
  # `coinex-mongo` volume is left in place, not deleted: it holds whatever 6.x
  # wrote, and an operator who wants it can still dump it with a 6 container.
  # Seed data for the new volume comes from `upstream-exchange/seed-market-data.mjs`.
  coinex-mongo:
    image: mongo:4.4
    container_name: intafaced-coinex-mongo
    ports:
      - '127.0.0.1:${COINEX_MONGO_PORT:-57017}:27017'
    volumes:
      - coinex-mongo-44:/data/db
    # `mongo`, not `mongosh`. The mongosh shell does not exist in any image
    # before MongoDB 5, so a mongosh healthcheck against 4.4 fails forever —
    # and because `market` and `otc` wait on `service_healthy`, that failure
    # holds down a database that is in fact perfectly healthy. The healthcheck
    # has to be pinned to the server generation the same way the image is.
    healthcheck:
      test: ['CMD', 'mongo', '--quiet', '--eval', 'db.adminCommand("ping")']
      interval: 5s
      timeout: 5s
      retries: 20

  # ── requirepass, because the clients authenticate whether or not we ask ──────
  #
  # Every module's application.properties sets `spring.redis.password`, so Jedis
  # sends AUTH on connect. An open Redis answers:
  #
  #   ERR AUTH <password> called without any password configured for the
  #   default user. Are you sure your configuration is correct?
  #
  # The pool then cannot hand out a connection, Spring Session's
  # EnableRedisKeyspaceNotificationsInitializer fails its afterPropertiesSet,
  # and the context dies. That is what exited `ucenter` — it never reached
  # MongoDB at all.
  #
  # The fix is a password on the SERVER, not the password stripped from the
  # clients. This Redis holds the exchange's HTTP sessions and is published on
  # the host; deleting the client-side password would fix the symptom by
  # removing the authentication, which is the wrong direction.
  coinex-redis:
    image: redis:7-alpine
    container_name: intafaced-coinex-redis
    command: ['redis-server', '--requirepass', '${COINEX_REDIS_PASSWORD:-coinex_dev_only}']
    ports:
      - '127.0.0.1:${COINEX_REDIS_PORT:-6381}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${COINEX_REDIS_PASSWORD:-coinex_dev_only}', '--no-auth-warning', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # Kafka in KRaft mode — no Zookeeper. The source targets Kafka 2.2 with
  # Zookeeper; KRaft removes a whole service and its own set of CVEs. If the
  # Java clients turn out to need the older protocol, that is a real finding and
  # belongs in the ADR, not in a silent downgrade back to Zookeeper.
  coinex-kafka:
    image: apache/kafka:3.7.0
    container_name: intafaced-coinex-kafka
    environment:
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@coinex-kafka:9093
      # ── Two client listeners, not one ────────────────────────────────────────
      #
      # A broker's advertised address is what it tells clients to RECONNECT to
      # after bootstrap. A single listener advertising `localhost:9094` is only
      # ever correct for a client running on the host: a client inside the
      # compose network bootstraps to coinex-kafka:9092, is told the broker
      # lives at `localhost:9094`, and then dials its own container.
      #
      # It fails silently. The bootstrap connection succeeds, so the log shows a
      # metadata response and looks healthy; every subsequent produce and fetch
      # goes nowhere. Verified from inside the broker's own container:
      #
      #   kafka-topics.sh --bootstrap-server localhost:9092 --list
      #   WARN [AdminClient] Connection to node 1 (localhost/127.0.0.1:9094)
      #        could not be established. Node may not be available.
      #
      # Every Java service here is in-network, so PLAINTEXT is advertised under
      # the compose DNS name and the host keeps EXTERNAL on the published port.
      # Without this the matching engine and the quote centre share a broker
      # neither of them can actually talk to.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://coinex-kafka:9092,EXTERNAL://localhost:${COINEX_KAFKA_PORT:-9094}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
    ports:
      # EXTERNAL (29092), not the in-network listener — and still loopback-only.
      - '127.0.0.1:${COINEX_KAFKA_PORT:-9094}:29092'
    volumes:
      - coinex-kafka:/var/lib/kafka/data

  # ── The exchange itself ─────────────────────────────────────────────────────
  #
  # Boot order is from the source README and it is not advisory: `market`
  # explicitly "needs to wait for Exchange.jar to fully start", and everything
  # registers with the Eureka registry in `cloud`.
  #
  # There is no JDK on the build host, so these run on the same JRE image the
  # README specifies (8u241 → eclipse-temurin:8-jre). Running them in the
  # compose network is also what lets the configs address `coinex-mysql` by name
  # instead of a hardcoded IP.
  #
  # THE SCHEMA IS CREATED BY THESE CONTAINERS, not by a SQL file. The README is
  # explicit: "the successfully compiled Jar will automatically map the Entity to
  # a database structure after the first run" via `ddl-auto=update`. So MySQL
  # starts empty and the first boot of a service that owns entities builds it.

  coinex-cloud:
    image: eclipse-temurin:8-jre
    container_name: intafaced-coinex-cloud
    working_dir: /app
    volumes:
      - ./upstream-exchange/00_framework:/app:ro
    command: ['java', '-Xms256m', '-Xmx512m', '-jar', 'cloud/target/cloud.jar']
    ports:
      - '127.0.0.1:${COINEX_EUREKA_PORT:-7000}:7000'
    depends_on:
      coinex-mysql: { condition: service_healthy }

  coinex-exchange:
    image: eclipse-temurin:8-jre
    container_name: intafaced-coinex-exchange
    working_dir: /app
    volumes:
      - ./upstream-exchange/00_framework:/app:ro
    command: ['java', '-Xms256m', '-Xmx512m', '-jar', 'exchange/target/exchange.jar']
    depends_on:
      coinex-cloud: { condition: service_started }
      coinex-kafka: { condition: service_started }

  # ── `--spring.redis.password` on the command line, and why it is not in .env ─
  #
  # The packaged application.properties says
  # `spring.redis.password=${COINEX_REDIS_PASSWORD}` — an environment
  # placeholder with no default. Nothing in this compose file ever set that
  # variable, so Spring resolved it to the literal string
  # `${COINEX_REDIS_PASSWORD}` and Jedis dutifully sent that as the password.
  #
  # A command-line argument outranks a classpath application.properties in
  # Spring Boot's property order, so this needs no rebuild of the jars and no
  # edit to vendored Java. It is also the same value compose gives the server
  # above, from one place, which is the property that was missing before.
  #
  # Every service that opens a Redis connection needs it. `exchange` does not —
  # it has no spring.redis.* at all — which is exactly why the matching engine
  # stayed up while ucenter died.

  # "Run market.jar (Quote Center, need to wait for Exchange.jar to fully
  # start)" — the README's own words. depends_on only orders container START,
  # not readiness, so a first boot may still need this restarted by hand.
  coinex-market:
    image: eclipse-temurin:8-jre
    container_name: intafaced-coinex-market
    working_dir: /app
    volumes:
      - ./upstream-exchange/00_framework:/app:ro
    command:
      - java
      - -Xms256m
      - -Xmx512m
      - -jar
      - market/target/market.jar
      - --spring.redis.password=${COINEX_REDIS_PASSWORD:-coinex_dev_only}
    # Published so the quote centre can actually be probed. Its routes live
    # under `server.context-path=/market`; a bare `/` is a 404 even when the
    # service is entirely healthy, which has been misread as "down" before.
    ports:
      - '127.0.0.1:${COINEX_MARKET_PORT:-6004}:6004'
    depends_on:
      coinex-exchange: { condition: service_started }
      coinex-mongo: { condition: service_healthy }
      coinex-redis: { condition: service_healthy }

  coinex-ucenter:
    image: eclipse-temurin:8-jre
    container_name: intafaced-coinex-ucenter
    working_dir: /app
    volumes:
      - ./upstream-exchange/00_framework:/app:ro
    command:
      - java
      - -Xms256m
      - -Xmx512m
      - -jar
      - ucenter-api/target/ucenter-api.jar
      - --spring.redis.password=${COINEX_REDIS_PASSWORD:-coinex_dev_only}
    # context-path=/uc
    ports:
      - '127.0.0.1:${COINEX_UCENTER_PORT:-6001}:6001'
    depends_on:
      coinex-market: { condition: service_started }
      coinex-redis: { condition: service_healthy }

  # ── exchange-api and otc-api, which were in no compose file at all ───────────
  #
  # Both jars are built and both were being started by hand with `docker run`
  # (the leftover containers still carry 0.0.0.0 port bindings from it). Being
  # absent from compose meant they could not be brought up with the stack, were
  # not on the compose network under a predictable name, and were invisible to
  # `docker compose ps` — so "the stack is up" was never a question anyone could
  # answer. They are ordinary services; they were simply never written down.

  # exchange-api is the REST face of the order book (context-path=/exchange).
  # `coinex-exchange` above is the matching engine — a different jar, port 6005,
  # and it serves no front-end route at all.
  coinex-exchange-api:
    image: eclipse-temurin:8-jre
    container_name: intafaced-coinex-exchange-api
    working_dir: /app
    volumes:
      - ./upstream-exchange/00_framework:/app:ro
    command:
      - java
      - -Xms256m
      - -Xmx512m
      - -jar
      - exchange-api/target/exchange-api.jar
      - --spring.redis.password=${COINEX_REDIS_PASSWORD:-coinex_dev_only}
    ports:
      - '127.0.0.1:${COINEX_EXCHANGE_API_PORT:-6003}:6003'
    depends_on:
      coinex-exchange: { condition: service_started }
      coinex-mongo: { condition: service_healthy }
      coinex-redis: { condition: service_healthy }

  # ── The OTC desk (context-path=/otc) — adverts, orders, appeals ──────────────
  #
  # THIS SERVICE STARTS AND THEN EXITS. It is declared anyway, deliberately.
  #
  # It was absent from this file, which meant `docker compose ps` could not show
  # it as broken — so it read as "not part of the stack" rather than "down", and
  # nobody could tell the difference. Declared-and-failing is the honest state;
  # silence is the one thing that must not happen again.
  #
  # `otc-api.jar` is MIS-PACKAGED. Three defects, all in the vendored build, all
  # needing a Maven rebuild that this host cannot do (no JDK, no mvn). Each was
  # confirmed by running it, not inferred:
  #
  #   1. spark-core is missing from the fat jar.
  #      `com.sparkframework:spark-core` is declared `<scope>system</scope>` with
  #      a systemPath (00_framework/core/pom.xml:104). spring-boot-maven-plugin
  #      excludes system-scope from repackaging unless `includeSystemScope` is
  #      set, and it is not — so whether the class survives is a per-module
  #      accident. ucenter-api, exchange-api and market have it; otc-api and
  #      admin do not. Failure: NoClassDefFoundError com/sparkframework/sql/DB.
  #      FIXED HERE at runtime — the jar is in the repo at /app/jar, so
  #      PropertiesLauncher + loader.path puts it back on the classpath without
  #      touching a line of Java. Real fix is <includeSystemScope>true</…>.
  #
  #   2. shiro-quartz is neither declared nor bundled.
  #      otc-api/pom.xml:110 declares only shiro-core; market/pom.xml and
  #      chat/pom.xml declare shiro-quartz. Spring Boot's condition evaluator
  #      reflects over bean method signatures during actuator autoconfiguration,
  #      hits QuartzSessionValidationScheduler and dies:
  #        Could not evaluate condition on EndpointWebMvcAutoConfiguration
  #        $EndpointWebMvcConfiguration due to
  #        org/apache/shiro/session/mgt/quartz/QuartzSessionValidationScheduler
  #      NOT fixed here. The jar is not in this repository, and committing an
  #      unverifiable binary onto the classpath of a money service is the exact
  #      practice the adoption ADR objects to. It belongs in otc-api/pom.xml.
  #
  #   3. ehcache.xml is missing from otc-api's resources.
  #      With 1 and 2 patched in a throwaway container it gets further and then
  #      fails on:
  #        Parameter 0 of method springCacheManagerWrapper in
  #        com.aqmd.netty.HawkNettyConfiguration required a bean of type
  #        'EhCacheCacheManager' that could not be found
  #        - cacheManager not loaded because ResourceCondition (EhCache) did not
  #          find resource 'classpath:/ehcache.xml'
  #      Only market and chat ship one. Adding it is a vendored-source change.
  #
  # So: 2 and 3 are reported, not worked around. When otc-api is rebuilt with a
  # corrected pom this block needs no change beyond dropping the launcher.
  coinex-otc:
    image: eclipse-temurin:8-jre
    container_name: intafaced-coinex-otc
    working_dir: /app
    volumes:
      - ./upstream-exchange/00_framework:/app:ro
    # PropertiesLauncher rather than `-jar`, so `loader.path` can re-add the
    # system-scope jar the repackager dropped. `-jar` on a Spring Boot fat jar
    # ignores -cp entirely, which is why this is not simply a classpath flag.
    command:
      - java
      - -Xms256m
      - -Xmx512m
      - -cp
      - otc-api/target/otc-api.jar
      - -Dloader.path=/app/jar
      - -Dloader.main=com.bizzan.bitrade.ApiApplication
      - org.springframework.boot.loader.PropertiesLauncher
      - --spring.redis.password=${COINEX_REDIS_PASSWORD:-coinex_dev_only}
    ports:
      - '127.0.0.1:${COINEX_OTC_PORT:-6006}:6006'
    depends_on:
      coinex-cloud: { condition: service_started }
      coinex-mysql: { condition: service_healthy }
      coinex-mongo: { condition: service_healthy }
      coinex-redis: { condition: service_healthy }

volumes:
  coinex-mysql:
  # `coinex-mongo` is retained but no longer mounted — it holds the mongo:6 data
  # directory that 4.4 cannot open. Declared so it is not reported as an orphan.
  coinex-mongo:
  coinex-mongo-44:
  coinex-kafka:
