# FH-SEC-02 / SECURITY-WHEN-PLAIN Track A — gitleaks always-on (complements secret-scan assignment law).
# Thrift: single short job; no full matrix. Docs-only PRs still run (secrets hide in md too).
name: Gitleaks

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: gitleaks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
