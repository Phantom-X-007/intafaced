name: one-shot-fix-trade-payout-wrap
on:
  push:
    branches:
      - feat/trade-affiliate-producer-payout
    paths:
      - tooling/tmp-fix-trade-payout-wrap.py
jobs:
  wrap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 tooling/tmp-fix-trade-payout-wrap.py
      - run: |
          git config user.name "Sovereign Builder"
          git config user.email "intafaced@gmail.com"
          git rm -f tooling/tmp-fix-trade-payout-wrap.py .github/workflows/one-shot-fix-trade-payout-wrap.yml
          git add services/svc-trade/src/spot/trade-service.ts
          git commit -m "fix(svc-trade): wrap payout calls after accrue"
          git push
