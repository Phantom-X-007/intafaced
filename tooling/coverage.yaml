# ─────────────────────────────────────────────────────────────────────────────
# THE COVERAGE MATRIX, MACHINE-READABLE.
#
# INTAFACED_DEFINITIVE_BUILD.md §25 line 740 names this file by path and says CI
# carries a `coverage-check` against it. Until 2026-08-03 neither existed, and
# the cost of that absence is written down in
# docs/audit/BUILD-COVERAGE-AUDIT-2026-08-03.md: forty law-specified
# capabilities with no tracker row, twenty of them the entire v2.1 and v2.2
# chapters — 100% of the law written after v2.0, invisible to the board, with
# nothing anywhere saying so.
#
# This file is the map from law to board. `tooling/ci/coverage-check.mjs` reads
# it and fails when either direction breaks: a law section with no row and no
# written exemption, or a row claiming a law that does not say it.
#
# HOW TO ADD SOMETHING
#   · new law chapter  → add it to `sections:` with a disposition. There is no
#     way to add a chapter and have nobody notice; that is the point.
#   · new capability   → add it to `capabilities:` with a law cite that resolves
#     and exactly ONE of `tracker:` / `exempt:` / `gap:`.
#   · new tracker row  → either a capability claims it, or it goes in
#     `tracker_extra:` with a basis that exists on disk.
#
# THE THREE STATES, and why there is no fourth
#   tracker:  the law line is on the board. The row carries owner, phase, status.
#   exempt:   somebody decided this is not in scope, and wrote down why and where.
#             "§27–§37 are not in scope for phase 2" is a legitimate answer.
#   gap:      it is missing, we know it is missing, and it is counted.
#   Silence is not a state. That is the whole disagreement with the old world.
# ─────────────────────────────────────────────────────────────────────────────

meta:
  law: INTAFACED_DEFINITIVE_BUILD.md
  law_version: '2.2 FINAL'
  tracker: tooling/tracker/features.mjs
  built_from: docs/audit/BUILD-COVERAGE-AUDIT-2026-08-03.md
  spec: '25:740'
  deviations:
    - >-
      §25:740 says "every named feature in Vol. I chapters I–XIX". Vol. I is a PDF at the repo root and
      is not machine-readable from here, so the enumerated axis is §25's own matrix — which the law says
      already contains every Vol. I feature exactly once — plus the §30 and §38 addenda that extend it.
      Checking against §25 rather than Vol. I means a Vol. I feature that never reached §25 is invisible
      to this gate. That is a limit of the source, not of the design, and it is stated rather than hidden.
    - >-
      §25:740 says each feature appears "with an owner and phase". Owner and phase are NOT duplicated
      into this file. They live on the tracker row, which is where ownership is actually claimed and
      handed over; copying them here would create a second place to be wrong. The gate resolves owner
      and phase through `tracker:` instead.
    - >-
      Outside §25, capabilities are enumerated at the granularity the audit established — one entry per
      identified obligation — not one per line of law. Every CHAPTER is accounted for; not every
      sentence is. A sentence-level map of 862 lines of prose would be a second law, and would rot.
    - >-
      "Any feature without a green DoD at its phase gate blocks the drop phase that promised it" is
      implemented against `drop_phases:` below and fires only when a phase is marked `promised: true`.
      Firing on unpromised phases would fail every run from day one and the gate would be switched off
      inside a day — see the ratchet note on `baseline:`.

# ── THE LAW'S CHAPTERS ───────────────────────────────────────────────────────
# Every `## N ·` heading in the law must appear here. This is the check that
# would have caught §27–§37: eleven chapters were written, none of them was
# listed anywhere, and no gate noticed.
sections:
  - id: 0
    title: DOCTRINE
    disposition: exempt
    reason: >-
      Doctrine is the constraint every capability is built under, not a capability. §0.6 (ledger is law)
      is enforced by custody-scan and vendor-java-money-scan; §0.7 (branding) by brand-scan. A tracker
      row for "doctrine" would be a row nobody could ever finish.
  - id: 1
    title: STACK
    disposition: exempt
    reason: >-
      Technology choices — language, database, bus, framework. Enforced by the repo existing and by
      workspace-sync, not by a board row. `infra.monorepo` already carries the scaffold.
  - id: 2
    title: MONOREPO LAYOUT
    disposition: exempt
    reason: >-
      Directory layout and the cross-service import rule. Enforced by workspace-sync and custody-scan.
      NOTE for the owner's pen — the audit (§B5 row 6) found svc-edge, svc-ws, svc-notify and four
      packages exist and appear in no §2 layout. That is a law amendment, not a coverage gap.
