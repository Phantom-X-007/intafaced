name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  gates:
    name: Doctrine gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # These run first and independently: a branding leak or a custody
      # violation is not something to discover after a ten-minute test run.
      - name: Brand scan (Doctrine §0.7)
        run: pnpm scan:brand
      - name: Custody scan (Doctrine §16.10)
        run: pnpm scan:custody
      - name: Vendor shell residue (mass-credit / CORS *)
        run: pnpm scan:vendor-shell
      - name: Workspace sync
        run: pnpm scan:workspace
      - name: Migration check (§14)
        run: pnpm db:check

      # A tracker that drifts from the code is worse than no tracker. This
      # fails if docs/TRACKER.md is stale, or if a feature claims "done" while
      # the service it lives in does not exist.
      - name: Tracker is honest
        run: pnpm tracker:check

  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm format:check

  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: intafaced
          POSTGRES_PASSWORD: intafaced
          POSTGRES_DB: intafaced
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U intafaced"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

      nats:
        image: nats:2.10-alpine
        ports: ['4222:4222', '8222:8222']

    env:
      # Residual #9: every money suite must hit real Postgres on CI — not skip.
      # Local defaults use :5433 + svc_* users; CI is :5432 after bootstrap.
      # Use 127.0.0.1 (not localhost) so Node does not try IPv6 ::1 before PG is up.
      CI: true
      REQUIRE_POSTGRES: '1'
      TEST_DATABASE_URL: postgres://intafaced:intafaced@127.0.0.1:5432/intafaced
      TEST_DATABASE_URL_PAY: postgres://svc_pay:svc_pay@127.0.0.1:5432/intafaced
      TEST_DATABASE_URL_IDENTITY: postgres://svc_identity:svc_identity@127.0.0.1:5432/intafaced
      TEST_DATABASE_URL_TOKEN: postgres://svc_token:svc_token@127.0.0.1:5432/intafaced
      TEST_DATABASE_URL_TRADE: postgres://svc_trade:svc_trade@127.0.0.1:5432/intafaced
      TEST_DATABASE_URL_P2P: postgres://svc_p2p:svc_p2p@127.0.0.1:5432/intafaced
      TEST_DATABASE_URL_BANK: postgres://svc_bank:svc_bank@127.0.0.1:5432/intafaced
      TEST_DATABASE_URL_BLUEPRINT: postgres://svc_blueprint:svc_blueprint@127.0.0.1:5432/intafaced
      TEST_DATABASE_URL_AGENTS: postgres://svc_agents:svc_agents@127.0.0.1:5432/intafaced
      REDIS_URL: redis://127.0.0.1:6379
      NATS_URL: nats://127.0.0.1:4222

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Bootstrap service schemas and roles
        run: |
          PGPASSWORD=intafaced psql -h localhost -U intafaced -d intafaced \
            -f tooling/infra/postgres-init/01-service-schemas.sql
          # ops role used by some ledger/indexer suites for CREATE SCHEMA
          PGPASSWORD=intafaced psql -h localhost -U intafaced -d intafaced -c \
            "GRANT CREATE ON DATABASE intafaced TO intafaced_ops; ALTER ROLE intafaced_ops WITH CREATEDB;"

      - name: Prove money-test DB URLs resolve (residual #9)
        run: node tooling/ci/assert-test-db-env.mjs

      - run: pnpm test

  # ── §14.3 — the money spine, end to end, against a real fleet ───────────────
  #
  # Not a second unit-test job. Every request goes through svc-edge on :4000 to
  # containers built from this commit, and the assertions are made on the
  # LEDGER's answer rather than on any service's opinion of a balance.
  #
  # It earned its place on the first run: it found two P0s that every unit test
  # in the repo agreed were fine, because both only exist across a process
  # boundary — svc-trade calling svc-identity without service credentials (every
  # `orders.create` a 500), and the HTTP ledger client flattening
  # `InsufficientFundsError` into a plain Error (insufficient funds answered 500
  # instead of 400). That is the entire argument for this job.
  e2e:
    name: E2E money spine (§14.3)
    runs-on: ubuntu-latest
    needs: [build]
    # The fleet is fifteen containers built from source. Generous, and still
    # bounded — a hung compose must fail the job rather than burn the runner.
    timeout-minutes: 45

    env:
      # Dev secrets, and they are dev secrets in a throwaway VM. They must be
      # ≥ 32 chars to satisfy the config schemas, and identical to what the
      # suite signs its operator token with.
      JWT_ACCESS_SECRET: ci-only-signing-secret-not-used-anywhere-real-000
      EDGE_PRINCIPAL_SECRET: ci-only-edge-principal-secret-not-real-00000000
      INTERNAL_SERVICE_SECRET: ci-only-internal-service-secret-not-real-00000
      PAY_CARD_SANDBOX_WEBHOOK_SECRET: ci-only-card-sandbox-webhook-secret-000000
      PAY_CRYPTO_WEBHOOK_SECRET: ci-only-crypto-webhook-secret-00000000000000

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # `.env` is what compose reads. Built from the checked-in example so a new
      # variable added there cannot be silently missing here.
      - name: Compose environment
        run: |
          cp .env.example .env
          {
            echo "JWT_ACCESS_SECRET=$JWT_ACCESS_SECRET"
            echo "EDGE_PRINCIPAL_SECRET=$EDGE_PRINCIPAL_SECRET"
            echo "INTERNAL_SERVICE_SECRET=$INTERNAL_SERVICE_SECRET"
            echo "PAY_CARD_SANDBOX_WEBHOOK_SECRET=$PAY_CARD_SANDBOX_WEBHOOK_SECRET"
            echo "PAY_CRYPTO_WEBHOOK_SECRET=$PAY_CRYPTO_WEBHOOK_SECRET"
          } >> .env

      # §14.6 — apps/admin needs an operator to reach the control plane, and no
      # login svc-identity can perform produces one. See the header of the
      # script: this is the honest workaround, not a shortcut, and it is a §13
      # socket until operator issuance lands.
      - name: Mint the console's operator token
        run: |
          echo "ADMIN_OPERATOR_TOKEN=$(node tooling/e2e/src/mint-operator-token.mjs)" >> .env

      - name: Bring up the fleet
        run: docker compose -f docker-compose.apps.yml up -d --build --wait --wait-timeout 900

      # `--wait` covers container health. This covers the front door specifically,
      # so a failure here says "the edge never answered" instead of surfacing as
      # forty assertion errors.
      - name: Wait for the front door
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:4000/ready > /dev/null; then
              echo "svc-edge ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "svc-edge never became ready"; exit 1

      - name: Run the e2e suite
        run: pnpm e2e

      # Only on failure, and it is the whole point: an e2e that fails in CI with
      # nothing but a stack trace costs an afternoon of local reproduction.
      - name: Fleet logs
        if: failure()
        run: docker compose -f docker-compose.apps.yml logs --tail 200

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.apps.yml down -v

  dod:
    name: Definition of Done
    runs-on: ubuntu-latest
    needs: [gates, build, test, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # §0.1 — never half done. This is the gate that decides whether a module
      # ships, and it runs on every PR so nothing "temporary" reaches main.
      #
      # `needs: e2e` is what lets the gate assert "e2e green in CI" as a fact
      # rather than as a checkbox: this job cannot run unless that one passed.
      - run: pnpm gate
