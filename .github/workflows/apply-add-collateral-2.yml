name: apply-add-collateral-2
on:
  push:
    branches:
      - feat/bank-loan-add-collateral-mark
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply mark refuse
        run: python3 scripts/apply-add-collateral-2.py
      - name: Commit and remove one-shot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/apply-add-collateral-2.yml scripts/apply-add-collateral-2.py
          git add services/svc-bank/src/loans/loan-service.ts
          git diff --cached --quiet && echo 'no loan-service change' && exit 1
          git commit -m "feat(svc-bank): addCollateral asks marksFor before lockCollateral"
          git push
