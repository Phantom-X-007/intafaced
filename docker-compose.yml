name: intafaced

services:
  postgres:
    image: postgres:16-alpine
    container_name: intafaced-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: intafaced
      POSTGRES_PASSWORD: intafaced
      POSTGRES_DB: intafaced
      # Ledger is law (§0.6) — deterministic numeric behaviour across machines.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    command:
      - postgres
      - -c
      - max_connections=200
      # Ledger posts run SERIALIZABLE; keep the snapshot machinery honest.
      - -c
      - default_transaction_isolation=read committed
      - -c
      - shared_preload_libraries=pg_stat_statements
    ports:
      # Host 5433 — a native Postgres commonly owns 5432, and the platform DB
      # must never depend on that slot being free. Container-internal is 5432.
      - '${POSTGRES_HOST_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./tooling/infra/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U intafaced -d intafaced']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: intafaced-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      # Host 6380 for the same reason as Postgres above — a local Redis often
      # owns 6379. Container-internal stays 6379.
      - '${REDIS_HOST_PORT:-6380}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2.10-alpine
    container_name: intafaced-nats
    restart: unless-stopped
    command:
      - '--jetstream'
      - '--store_dir=/data'
      - '--http_port=8222'
      - '--name=intafaced-nats'
    ports:
      - '4222:4222' # client
      - '8222:8222' # monitoring
    volumes:
      - natsdata:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O- http://localhost:8222/healthz || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    container_name: intafaced-otel
    restart: unless-stopped
    command: ['--config=/etc/otel/config.yaml']
    volumes:
      - ./tooling/infra/otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - '4317:4317' # OTLP gRPC
      - '4318:4318' # OTLP HTTP
    depends_on:
      - tempo
      - prometheus

  tempo:
    image: grafana/tempo:2.6.1
    container_name: intafaced-tempo
    restart: unless-stopped
    command: ['-config.file=/etc/tempo/tempo.yaml']
    volumes:
      - ./tooling/infra/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempodata:/var/tempo
    ports:
      - '3200:3200'

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: intafaced-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yaml'
      - '--web.enable-remote-write-receiver'
      - '--enable-feature=exemplar-storage'
    volumes:
      - ./tooling/infra/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - promdata:/prometheus
    ports:
      - '9090:9090'

  # ══════════════════════════════════════════════════════════════════════════
  # DEV ONLY — A THROWAWAY EVM. NEVER DEPLOY THIS. NEVER POINT IT AT VALUE.
  # ══════════════════════════════════════════════════════════════════════════
  #
  # § no-deploy: evm — this service exists so `services/svc-protocol` has a
  # chain to answer to on a laptop. It is not a chain decision, it is not a
  # staging chain, and it must never appear in any deploy manifest. A local
  # dev chain and a production chain are different questions and only the
  # second one needs a human to decide it.
  #
  # ── What it is ────────────────────────────────────────────────────────────
  #
  # Anvil (Foundry), pinned. Instant mining, ten pre-funded accounts derived
  # from the `test test ... junk` mnemonic every EVM dev tool prints on start.
  # Those keys are public by design and worthless by design; see
  # `services/svc-protocol/scripts/dev-chain.ts` for the full statement and the
  # guard that refuses to sign with them anywhere else.
  #
  # ── Why it holds no volume ────────────────────────────────────────────────
  #
  # State is deliberately ephemeral. A restart gives a genesis-fresh chain, the
  # deployer's nonce is 0 again, and `pnpm --filter @intafaced/svc-protocol
  # chain:deploy` therefore lands the suite at the SAME addresses every time —
  # which is what lets docker-compose.apps.yml name them as defaults instead of
  # making every developer copy hex out of a terminal. Persisting the chain
  # would break that determinism for no benefit nobody asked for.
  #
  # ── What it does NOT provide ──────────────────────────────────────────────
  #
  # No ERC-4337 EntryPoint (a public singleton we do not own, not in this repo)
  # and no bundler. So `protocol.relayUserOperation` still cannot work here —
  # it refuses, correctly, exactly as it does with no chain at all.
  #
  # Stop it and everything chain-dependent in svc-protocol goes back to the
  # typed refusals it ships with (`protocol.chain_unreachable`). That is the
  # property under test in `chain/refusal-without-chain.test.ts`.
  evm:
    image: ghcr.io/foundry-rs/foundry:v1.5.1
    container_name: intafaced-evm-dev
    restart: unless-stopped
    labels:
      com.intafaced.environment: 'dev-only'
      com.intafaced.deploy: 'never'
    # The image's entrypoint is `/bin/sh -c`, so this is one string, not argv.
    command:
      - >-
        anvil
        --host 0.0.0.0
        --port 8545
        --chain-id ${PROTOCOL_CHAIN_ID:-31337}
        --accounts 10
        --balance 10000
        --block-base-fee-per-gas 0
        --silent
    ports:
      # 8545 is the EVM dev convention and nothing else in this stack wants it.
      # Overridable because a developer may already run their own node there.
      - '${EVM_HOST_PORT:-8545}:8545'
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          cast block-number --rpc-url http://127.0.0.1:8545 > /dev/null 2>&1 || exit 1
      interval: 5s
      timeout: 5s
      retries: 20

  grafana:
    image: grafana/grafana:11.4.0
    container_name: intafaced-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: intafaced
      GF_SECURITY_ADMIN_PASSWORD: intafaced
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - ./tooling/infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    ports:
      - '3001:3000'
    depends_on:
      - prometheus
      - tempo

volumes:
  pgdata:
  redisdata:
  natsdata:
  promdata:
  tempodata:
  grafanadata:
