# Supply chain — the ban we wrote in Phase B §5 and never instrumented.
#
# "Hot-wallet random npm — custody supply chain" has been on the kill list since
# the horizon map was written. Until this workflow there was no dependabot, no
# `pnpm audit`, no SBOM, and nothing anywhere that asked whether a dependency
# carried a known vulnerability. A mutation-tested secret scanner sat beside a
# dependency tree nothing had ever looked at.
#
# Uses NO third-party action, for the same reason gitleaks.yml uses the binary
# rather than gitleaks-action: a workflow installed to reduce third-party trust
# should not begin by adding some. Everything here is `pnpm audit` — already in
# the toolchain — read by tooling/ci/dependency-audit.mjs.
#
# THRIFT: this does not run on every push. It runs when the dependency surface
# actually changes, plus once a week to catch advisories published against
# dependencies we did not touch (which is how most of them arrive). One job,
# no build, no services. See docs/GITHUB-CI-SPEND-CONTROL-2026-07-31.md.
name: Supply chain

on:
  pull_request:
    paths:
      - 'pnpm-lock.yaml'
      - '**/package.json'
      - '.github/workflows/**'
      - '.github/dependabot.yml'
      - 'tooling/ci/dependency-audit.mjs'
  schedule:
    # Mondays, ahead of the dependabot run on the same day, so a human opening
    # the grouped PR already knows what the tree looked like before it.
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # No `--frozen-lockfile` install: the audit reads the lockfile, and a full
      # workspace install would spend minutes to tell us nothing extra.
      - name: Audit dependencies against the frozen advisory list
        run: node tooling/ci/dependency-audit.mjs
