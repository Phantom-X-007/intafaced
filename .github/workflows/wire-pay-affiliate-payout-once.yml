name: wire-pay-affiliate-payout-once
on:
  push:
    branches: [feat/pay-affiliate-producer-payout]
    paths:
      - '.github/workflows/wire-pay-affiliate-payout-once.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pay-affiliate-producer-payout
      - run: python3 services/svc-pay/scripts/_wire_pay_affiliate_payout.py
      - run: |
          rm -f services/svc-pay/scripts/_wire_pay_affiliate_payout.py
          rm -f .github/workflows/wire-pay-affiliate-payout-once.yml
          git config user.name "Sovereign Builder"
          git config user.email "intafaced@gmail.com"
          git add -A
          git commit -m "feat(svc-pay): fire affiliate payout after settlement"
          git push
