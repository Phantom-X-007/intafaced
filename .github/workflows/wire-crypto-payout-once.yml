name: wire-crypto-payout-once
on:
  push:
    paths:
      - .github/workflows/wire-crypto-payout-once.yml
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pay-crypto-payout-stored-evm
      - name: Apply stored-EVM crypto payout patch
        run: git apply services/svc-pay/scripts/crypto-payout.patch
      - name: Commit patch and self-delete
        run: |
          git config user.name "Sovereign Builder"
          git config user.email "intafaced@gmail.com"
          git rm -f .github/workflows/wire-crypto-payout-once.yml
          git rm -f services/svc-pay/scripts/crypto-payout.patch
          git rm -f services/svc-pay/scripts/wire-crypto-payout.py
          git add services/svc-pay/src
          git commit -m "feat(svc-pay): crypto payout uses stored EVM dest through ledger-client"
          git push origin HEAD:feat/pay-crypto-payout-stored-evm
